// HR — full employee CRUD, live payroll
// ═══════════════════════════════════════════════════════════════════════════════
function HR() {
  const { state, actions } = useApp();
  const [tab, setTab] = useState("employees");
  const [showM, setShowM] = useState(false);
  const [editEmp, setEditEmp] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [show, toastEl] = useToast();
  const sel = useSelectors();

  const employees = state.employees || [];
  const emptyForm = {name:"",email:"",phone:"",dept:"Engineering",role:"",status:"Active",sal:0,join:today(),nationalId:"",kraPin:"",leave:0,leaveBalance:21};
  const [form, setForm] = useState(emptyForm);
  const setF=(k,v)=>setForm(p=>({...p,[k]:v}));

  const openNew=()=>{ setForm(emptyForm); setEditEmp(null); setShowM(true); };
  const openEdit=(emp)=>{ setForm({...emp}); setEditEmp(emp.id); setShowM(true); };

  const saveEmp=()=>{
    if(!form.name.trim()){show("Name is required","r");return;}
    if(!form.email.trim()){show("Email is required","r");return;}
    if(!form.role.trim()){show("Role is required","r");return;}
    if(editEmp){
      actions.updateEmployee({...form,id:editEmp,sal:parseFloat(form.sal)||0});
      show("Employee updated","g");
    } else {
      actions.addEmployee({...form,id:`usr_${uid()}`,sal:parseFloat(form.sal)||0});
      show("Employee added","g");
    }
    setShowM(false);
  };

  const deleteEmp=(id)=>{
    setConfirm({msg:"Remove this employee? This cannot be undone.",onYes:()=>{ actions.deleteEmployee(id); show("Employee removed"); setConfirm(null); }});
  };

  // Payroll computation
  const payrollData = useMemo(()=> employees.map(e=>{
    const gross = e.sal;
    const nhif  = Math.round(gross*0.028);
    const nssf  = Math.min(2160, Math.round(gross*0.06));
    const grossTaxable = gross - nhif - nssf;
    let paye = 0;
    if(grossTaxable > 57667) paye = (grossTaxable-57667)*0.3 + 16901;
    else if(grossTaxable > 32667) paye = (grossTaxable-32667)*0.25 + 4276;
    else if(grossTaxable > 24000) paye = (grossTaxable-24000)*0.20 + 667;
    else if(grossTaxable > 12000) paye = (grossTaxable-12000)*0.15;
    paye = Math.max(0,Math.round(paye));
    const net = gross - nhif - nssf - paye;
    return {...e,gross,nhif,nssf,paye,net};
  }),[employees]);

  return (
    <div className="ci">
      {toastEl}{confirm&&<Confirm msg={confirm.msg} onYes={confirm.onYes} onNo={()=>setConfirm(null)}/>}
      <div className="ph">
        <div><h1 className="ptitle">Human Resources</h1><p className="psub">People · Payroll · Attendance · Recruitment · Appraisals</p></div>
        <button className="btn btp" onClick={openNew}>+ New Employee</button>
      </div>
      <div className="g g4 gap4 mb5">
        {[
          {l:"Total Employees",v:fmtN(employees.length),            ico:"👥",c:"#6c6cff"},
          {l:"On Leave",       v:fmtN(employees.filter(e=>e.status==="On Leave").length),ico:"🏖️",c:"#f59e0b"},
          {l:"Payroll (Month)",v:fmt(sel.payrollNet),               ico:"💰",c:"#22c55e"},
          {l:"Open Positions", v:"3",                               ico:"📋",c:"#06b6d4"},
        ].map(s=>(
          <div key={s.l} className="stat"><div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div><div className="slb">{s.l}</div><div className="sv" style={{fontSize:22}}>{s.v}</div></div>
        ))}
      </div>
      <div className="tabs mb4">{["employees","payroll","attendance","recruitment"].map(t=><div key={t} className={`tab ${tab===t?"act":""}`} onClick={()=>setTab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</div>)}</div>

      {tab==="employees"&&(
        <div className="tw bd">
          <table>
            <thead><tr><th>Employee</th><th>Department</th><th>Role</th><th>Status</th><th>Salary/Mo</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody>
              {employees.map(e=>(
                <tr key={e.id}>
                  <td><div className="f fa gap2"><Av name={e.name} size="sm"/><div><div>{e.name}</div><div className="xs t3">{e.email}</div></div></div></td>
                  <td className="t2">{e.dept}</td><td>{e.role}</td>
                  <td><Bdg s={e.status}/></td>
                  <td className="mono xs">{fmt(e.sal)}</td>
                  <td className="t3 xs">{e.join}</td>
                  <td><div className="f fa gap1">
                    <button className="btn btg bxs" onClick={()=>openEdit(e)}>Edit</button>
                    <button className="btn btd bxs" onClick={()=>deleteEmp(e.id)}>Del</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab==="payroll"&&(
        <div className="g gap4" style={{gridTemplateColumns:"1fr 280px"}}>
          <div className="card cp">
            <div className="f fj fa mb4"><div className="ct">Payroll — {new Date().toLocaleString('default',{month:'long',year:'numeric'})}</div><button className="btn btp bsm" onClick={()=>show("Payroll processed and sent to bank","g")}>▶ Run Payroll</button></div>
            <div className="tw">
              <table>
                <thead><tr><th>Employee</th><th>Gross</th><th>NHIF</th><th>NSSF</th><th>PAYE</th><th>Net Pay</th></tr></thead>
                <tbody>{payrollData.map(e=>(
                  <tr key={e.id}>
                    <td><div className="f fa gap2"><Av name={e.name} size="sm"/><span>{e.name}</span></div></td>
                    <td className="mono xs">{fmt(e.gross)}</td>
                    <td className="mono xs tr">{fmt(e.nhif)}</td>
                    <td className="mono xs tr">{fmt(e.nssf)}</td>
                    <td className="mono xs tr">{fmt(e.paye)}</td>
                    <td className="mono bold" style={{fontSize:12}}>{fmt(e.net)}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
          <div className="card cp">
            <div className="ct mb3">Payroll Summary</div>
            {[
              {l:"Gross Payroll",  v:sel.payrollGross, c:"var(--t)"},
              {l:"Total NHIF",     v:sel.payrollNHIF,  c:"var(--r)"},
              {l:"Total NSSF",     v:sel.payrollNSSF,  c:"var(--r)"},
              {l:"Total PAYE",     v:sel.payrollPAYE,  c:"var(--r)"},
              {l:"Net Payroll",    v:sel.payrollNet,   c:"var(--g)"},
            ].map(r=>(
              <div key={r.l} className="mrow"><span className="sm t2">{r.l}</span><span className="mono bold xs" style={{color:r.c}}>{fmt(r.v)}</span></div>
            ))}
          </div>
        </div>
      )}

      {(tab==="attendance"||tab==="recruitment")&&(
        <div className="empty"><div className="eico">{tab==="attendance"?"📋":"📝"}</div><div className="etitle">{tab.charAt(0).toUpperCase()+tab.slice(1)}</div><div className="esub">Module ready — integration available</div></div>
      )}

      {showM&&(
        <Modal title={editEmp?"Edit Employee":"New Employee"} onClose={()=>setShowM(false)} size="mlg"
          footer={<><button className="btn btg" onClick={()=>setShowM(false)}>Cancel</button><button className="btn btp" onClick={saveEmp}>{editEmp?"Save Changes":"Add Employee"}</button></>}>
          <div className="g g2 gap3">
            <div className="field"><label className="flbl">Full Name *</label><input className="inp" value={form.name} onChange={e=>setF("name",e.target.value)} placeholder="First Last"/></div>
            <div className="field"><label className="flbl">Email *</label><input className="inp" type="email" value={form.email} onChange={e=>setF("email",e.target.value)} placeholder="name@company.ke"/></div>
            <div className="field"><label className="flbl">Phone</label><input className="inp" value={form.phone} onChange={e=>setF("phone",e.target.value)} placeholder="+254 7xx xxx xxx"/></div>
            <div className="field"><label className="flbl">Department</label>
              <select className="inp" value={form.dept} onChange={e=>setF("dept",e.target.value)}>
                {["Engineering","Sales","Finance","HR","Marketing","Operations","Executive"].map(d=><option key={d}>{d}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Job Title / Role *</label><input className="inp" value={form.role} onChange={e=>setF("role",e.target.value)} placeholder="e.g. Software Engineer"/></div>
            <div className="field"><label className="flbl">Status</label>
              <select className="inp" value={form.status} onChange={e=>setF("status",e.target.value)}>
                <option>Active</option><option>On Leave</option><option>Inactive</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Basic Salary (KES)</label><input className="inp" type="number" value={form.sal} onChange={e=>setF("sal",e.target.value)} placeholder="0"/></div>
            <div className="field"><label className="flbl">Start Date</label><input className="inp" type="date" value={form.join} onChange={e=>setF("join",e.target.value)}/></div>
            <div className="field"><label className="flbl">National ID</label><input className="inp" value={form.nationalId} onChange={e=>setF("nationalId",e.target.value)} placeholder="ID number"/></div>
            <div className="field"><label className="flbl">KRA PIN</label><input className="inp" value={form.kraPin} onChange={e=>setF("kraPin",e.target.value)} placeholder="KRA PIN"/></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// PROJECTS — task CRUD, live progress
// ═══════════════════════════════════════════════════════════════════════════════
function Projects() {
  const { state, actions } = useApp();
  const [view, setView] = useState("projects");
  const [selProj, setSelProj] = useState(null);
  const [showProjM, setShowProjM] = useState(false);
  const [showTaskM, setShowTaskM] = useState(false);
  const [show, toastEl] = useToast();

  const projects = state.projects || [];
  const tasks = state.tasks || [];
  const employees = state.employees || [];

  const projForm0 = {name:"",client:"",status:"Planning",deadline:"",budget:0};
  const [projForm, setProjForm] = useState(projForm0);
  const setPF=(k,v)=>setProjForm(p=>({...p,[k]:v}));

  const taskForm0 = {projId:selProj?.id||"",title:"",status:"To Do",assignee:"usr_AM",priority:"Medium",due:"",notes:""};
  const [taskForm, setTaskForm] = useState(taskForm0);
  const setTF=(k,v)=>setTaskForm(p=>({...p,[k]:v}));

  const saveProj=()=>{
    if(!projForm.name.trim()){show("Project name required","r");return;}
    actions.addProject({...projForm,id:`proj_${uid()}`,team:[state.currentUser?.id||"usr_AM"],spent:0,createdAt:now()});
    show("Project created","g"); setShowProjM(false); setProjForm(projForm0);
  };

  const saveTask=()=>{
    if(!taskForm.title.trim()){show("Task title required","r");return;}
    actions.addTask({...taskForm,id:`task_${uid()}`});
    show("Task added","g"); setShowTaskM(false); setTaskForm(taskForm0);
  };

  const cycleStatus=(task)=>{
    const cycle={["To Do"]:"In Progress",["In Progress"]:"Done",Done:"To Do"};
    actions.updateTask({id:task.id,status:cycle[task.status]||"To Do"});
    show(`Task → ${cycle[task.status]||"To Do"}`,"g");
  };

  const selProjTasks = selProj ? tasks.filter(t=>t.projId===selProj.id) : [];
  const TASK_COLS = ["To Do","In Progress","Done"];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {toastEl}
      <div className="ci" style={{paddingBottom:0,flexShrink:0}}>
        <div className="ph" style={{marginBottom:12}}>
          <div><h1 className="ptitle">Projects</h1><p className="psub">{projects.filter(p=>p.status==="In Progress").length} active · Tasks · Timelines · Milestones</p></div>
          <div className="f fa gap2">
            <div className="tabs">{["projects","board","timeline"].map(v=><div key={v} className={`tab ${view===v?"act":""}`} onClick={()=>setView(v)}>{v.charAt(0).toUpperCase()+v.slice(1)}</div>)}</div>
            <button className="btn btp bsm" onClick={()=>setShowProjM(true)}>+ New Project</button>
          </div>
        </div>
      </div>

      {view==="projects"&&(
        <div className="ci" style={{paddingTop:8,flex:1,overflowY:"auto"}}>
          <div className="g g2 gap4 mb4">
            {projects.map(p=>{
              const pTasks=tasks.filter(t=>t.projId===p.id);
              const done=pTasks.filter(t=>t.status==="Done").length;
              const prog=pTasks.length?Math.round((done/pTasks.length)*100):p.prog||0;
              return (
                <div key={p.id} className="card cp cur" onClick={()=>{setSelProj(p);setView("board");}}>
                  <div className="f fj fa mb2"><div><div className="bold" style={{fontSize:14}}>{p.name}</div><div className="xs t3">Client: {p.client}</div></div><Bdg s={p.status}/></div>
                  <div className="f fa gap2 mb2"><Prog v={prog}/><span className="xs bold" style={{minWidth:28}}>{prog}%</span></div>
                  <div className="f fj xs t3"><span>📅 {p.deadline}</span><span>✅ {done}/{pTasks.length||0} tasks</span><span>💰 {fmt(p.budget||0)}</span></div>
                </div>
              );
            })}
            <div className="card cp cur" style={{border:"1px dashed var(--bd)",display:"flex",alignItems:"center",justifyContent:"center",minHeight:120}} onClick={()=>setShowProjM(true)}>
              <div style={{textAlign:"center",color:"var(--t3)"}}><div style={{fontSize:28}}>+</div><div className="xs">New Project</div></div>
            </div>
          </div>
        </div>
      )}

      {view==="board"&&(
        <div style={{flex:1,overflow:"hidden",padding:"0 24px 12px"}}>
          <div className="f fj fa mb2" style={{paddingLeft:2}}>
            <div className="xs t3">{selProj?.name||"All Tasks"} — {selProjTasks.length} tasks</div>
            <div className="f fa gap2">
              {selProj&&<button className="btn btg bxs" onClick={()=>setView("projects")}>← Projects</button>}
              <button className="btn btp bxs" onClick={()=>{setTaskForm({...taskForm0,projId:selProj?.id||""});setShowTaskM(true);}}>+ Task</button>
            </div>
          </div>
          <div className="kan noscroll">
            {TASK_COLS.map(col=>{
              const colTasks=(selProj?selProjTasks:tasks).filter(t=>t.status===col);
              return (
                <div key={col} className="kcol" style={{minWidth:240,maxWidth:240}}>
                  <div className="kch"><span className="kct">{col}</span><span className="kcnt">{colTasks.length}</span></div>
                  <div className="kcards noscroll">
                    {colTasks.map(t=>{
                      const emp=employees.find(e=>e.id===t.assignee);
                      return (
                        <div key={t.id} className="kcard">
                          <div className="kctitle" style={{fontSize:12}}>{t.title}</div>
                          <div className="f fa gap1 mb1">
                            <Bdg s={t.priority==="High"?"High":t.priority==="Low"?"Low":"Medium"}/>
                            {t.due&&<span className="xs t3">📅 {t.due}</span>}
                          </div>
                          <div className="f fj fa mt1">
                            {emp&&<div className="f fa gap1"><Av name={emp.name} size="sm"/><span className="xs t3">{emp.name.split(" ")[0]}</span></div>}
                            <button className="btn btg bxs" style={{fontSize:9}} onClick={()=>cycleStatus(t)}>→ Next</button>
                          </div>
                        </div>
                      );
                    })}
                    <div className="kadd" onClick={()=>{setTaskForm({...taskForm0,projId:selProj?.id||"",status:col});setShowTaskM(true);}}>+ Add task</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {view==="timeline"&&(
        <div className="ci" style={{paddingTop:8,flex:1,overflowY:"auto"}}>
          <div className="card" style={{padding:0,overflowX:"auto"}}>
            <div style={{minWidth:700}}>
              <div className="f fa" style={{padding:"12px 16px",borderBottom:"1px solid var(--bd)",background:"var(--bg3)"}}>
                <div style={{width:180,flexShrink:0,fontWeight:700,fontSize:12}}>Project</div>
                {["May","Jun","Jul","Aug"].map(m=><div key={m} style={{flex:1,textAlign:"center",fontSize:11,color:"var(--t3)",fontWeight:700}}>{m}</div>)}
              </div>
              {projects.map((p,i)=>{
                const offsets=[0,20,40,60,70]; const widths=[60,50,30,40,30];
                return (
                  <div key={p.id} className="f fa" style={{padding:"14px 16px",borderBottom:"1px solid var(--bd)"}}>
                    <div style={{width:180,flexShrink:0}}><div style={{fontSize:12.5,fontWeight:600}}>{p.name}</div><Bdg s={p.status}/></div>
                    <div style={{flex:1,position:"relative",height:22}}>
                      <div style={{position:"absolute",left:`${offsets[i]||0}%`,width:`${widths[i]||40}%`,height:"100%",background:"linear-gradient(to right,var(--a),var(--a2))",borderRadius:4,opacity:p.status==="Done"?1:.7}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {showProjM&&(
        <Modal title="New Project" onClose={()=>setShowProjM(false)}
          footer={<><button className="btn btg" onClick={()=>setShowProjM(false)}>Cancel</button><button className="btn btp" onClick={saveProj}>Create Project</button></>}>
          <div className="g g2 gap3">
            <div className="field"><label className="flbl">Project Name *</label><input className="inp" value={projForm.name} onChange={e=>setPF("name",e.target.value)} placeholder="e.g. ERP Migration"/></div>
            <div className="field"><label className="flbl">Client</label><input className="inp" value={projForm.client} onChange={e=>setPF("client",e.target.value)} placeholder="Client or Internal"/></div>
            <div className="field"><label className="flbl">Status</label>
              <select className="inp" value={projForm.status} onChange={e=>setPF("status",e.target.value)}>
                <option>Planning</option><option>In Progress</option><option>On Hold</option><option>Done</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Deadline</label><input className="inp" type="date" value={projForm.deadline} onChange={e=>setPF("deadline",e.target.value)}/></div>
            <div className="field"><label className="flbl">Budget (KES)</label><input className="inp" type="number" value={projForm.budget} onChange={e=>setPF("budget",e.target.value)} placeholder="0"/></div>
          </div>
        </Modal>
      )}

      {showTaskM&&(
        <Modal title="New Task" onClose={()=>setShowTaskM(false)}
          footer={<><button className="btn btg" onClick={()=>setShowTaskM(false)}>Cancel</button><button className="btn btp" onClick={saveTask}>Add Task</button></>}>
          <div className="g g2 gap3">
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Task Title *</label><input className="inp" value={taskForm.title} onChange={e=>setTF("title",e.target.value)} placeholder="Describe the task…"/></div>
            <div className="field"><label className="flbl">Project</label>
              <select className="inp" value={taskForm.projId} onChange={e=>setTF("projId",e.target.value)}>
                <option value="">No project</option>
                {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Assigned To</label>
              <select className="inp" value={taskForm.assignee} onChange={e=>setTF("assignee",e.target.value)}>
                {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Status</label>
              <select className="inp" value={taskForm.status} onChange={e=>setTF("status",e.target.value)}>
                <option>To Do</option><option>In Progress</option><option>Done</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Priority</label>
              <select className="inp" value={taskForm.priority} onChange={e=>setTF("priority",e.target.value)}>
                <option>High</option><option>Medium</option><option>Low</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Due Date</label><input className="inp" type="date" value={taskForm.due} onChange={e=>setTF("due",e.target.value)}/></div>
            <div className="field"><label className="flbl">Notes</label><textarea className="inp" value={taskForm.notes} onChange={e=>setTF("notes",e.target.value)} style={{minHeight:60}} placeholder="Optional context…"/></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// HELPDESK — full ticket CRUD, replies, resolve
// ═══════════════════════════════════════════════════════════════════════════════
function Helpdesk() {
  const { state, actions } = useApp();
  const [sel, setSel] = useState(null);
  const [showM, setShowM] = useState(false);
  const [reply, setReply] = useState("");
  const [show, toastEl] = useToast();

  const tickets = state.tickets || [];
  const customers = state.customers || [];
  const employees = state.employees || [];

  const emptyForm={subj:"",prio:"Medium",client:"",custId:"",agent:state.currentUser?.id||"usr_AM",agentName:state.currentUser?.name||"Alex Morgan",type:"Bug"};
  const [form, setForm] = useState(emptyForm);
  const setF=(k,v)=>setForm(p=>({...p,[k]:v}));

  const genTkId=()=>{const last=tickets[0]?.id||"TK-000";const n=parseInt(last.replace("TK-",""))+1;return `TK-${String(n).padStart(3,"0")}`;};

  const saveTicket=()=>{
    if(!form.subj.trim()){show("Subject required","r");return;}
    if(!form.client.trim()){show("Client required","r");return;}
    const emp=employees.find(e=>e.id===form.agent);
    actions.addTicket({...form,id:genTkId(),agentName:emp?.name||"",created:today(),replies:[]});
    show("Ticket created","g"); setShowM(false); setForm(emptyForm);
  };

  const sendReply=()=>{
    if(!reply.trim()||!sel){return;}
    const r={author:state.currentUser?.name||"Agent",text:reply.trim(),time:now()};
    actions.replyTicket(sel.id,r);
    setSel(prev=>({...prev,replies:[...(prev.replies||[]),r]}));
    setReply("");
    show("Reply sent","g");
  };

  const resolve=(id)=>{
    actions.resolveTicket(id);
    if(sel?.id===id) setSel(prev=>({...prev,status:"Resolved"}));
    show("Ticket resolved ✓","g");
  };

  const open  = tickets.filter(t=>t.status==="Open").length;
  const inProg= tickets.filter(t=>t.status==="In Progress").length;
  const resolved=tickets.filter(t=>t.status==="Resolved").length;

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div><h1 className="ptitle">Helpdesk</h1><p className="psub">Support tickets · SLAs · Customer portal · Escalations</p></div>
        <div className="f fa gap2"><button className="btn btg bsm">📊 SLA Report</button><button className="btn btp bsm" onClick={()=>setShowM(true)}>+ New Ticket</button></div>
      </div>
      <div className="g g4 gap4 mb5">
        {[{l:"Open",v:fmtN(open),c:"#f59e0b",ico:"🔓"},{l:"In Progress",v:fmtN(inProg),c:"#6c6cff",ico:"⚙️"},{l:"Resolved",v:fmtN(resolved),c:"#22c55e",ico:"✅"},{l:"Avg Response",v:"2.4h",c:"var(--t)",ico:"⏱️"}].map(s=>(
          <div key={s.l} className="stat"><div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div><div className="slb">{s.l}</div><div className="sv" style={{fontSize:22,color:s.c}}>{s.v}</div></div>
        ))}
      </div>
      <div className="g gap4" style={{gridTemplateColumns:"1fr 320px"}}>
        <div className="tw bd">
          <table>
            <thead><tr><th>Ticket ID</th><th>Subject</th><th>Client</th><th>Type</th><th>Priority</th><th>Status</th><th>Agent</th><th>Created</th></tr></thead>
            <tbody>{tickets.map(t=>(
              <tr key={t.id} className="cur" onClick={()=>setSel(t)} style={{background:sel?.id===t.id?"var(--sf)":undefined}}>
                <td className="mono ta" style={{fontSize:11,color:"var(--a)"}}>{t.id}</td>
                <td style={{maxWidth:200}} className="trunc">{t.subj}</td>
                <td className="t2 xs">{t.client}</td>
                <td><span className="badge bgr xs">{t.type}</span></td>
                <td><Bdg s={t.prio}/></td><td><Bdg s={t.status}/></td>
                <td><Av name={t.agentName} size="sm"/></td>
                <td className="t3 xs">{t.created}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        <div className="card cp">
          {sel?(
            <>
              <div className="f fj fa mb3">
                <div><div className="ct">{sel.id}</div><div className="xs t3 mt1">{sel.created}</div></div>
                <button className="btn btg bxs" onClick={()=>setSel(null)}>✕</button>
              </div>
              <div className="bold mb1" style={{fontSize:13.5}}>{sel.subj}</div>
              <div className="f fa gap2 mb3"><Bdg s={sel.prio}/><Bdg s={sel.status}/><span className="badge bgr xs">{sel.type}</span></div>
              <div className="fc gap1 mb4">
                {[{l:"Client",v:sel.client},{l:"Agent",v:sel.agentName}].map(r=>(
                  <div key={r.l} className="f fj xs"><span className="t3">{r.l}</span><span className="semi">{r.v}</span></div>
                ))}
              </div>
              {(sel.replies||[]).length>0&&(
                <div className="mb3">
                  <div className="sectitle">Replies</div>
                  {(sel.replies||[]).map((r,i)=>(
                    <div key={i} style={{background:"var(--bg3)",border:"1px solid var(--bd)",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                      <div className="xs bold">{r.author} <span className="t3 normal">{timeAgo(r.time)}</span></div>
                      <div className="xs t2 mt1">{r.text}</div>
                    </div>
                  ))}
                </div>
              )}
              {sel.status!=="Resolved"&&(
                <>
                  <div className="sectitle">Add Reply</div>
                  <textarea className="inp mb2" style={{minHeight:80}} value={reply} onChange={e=>setReply(e.target.value)} placeholder="Type your response…"/>
                  <div className="f gap2">
                    <button className="btn btp f1" style={{justifyContent:"center"}} onClick={sendReply} disabled={!reply.trim()}>Send Reply</button>
                    <button className="btn bts bsm" onClick={()=>resolve(sel.id)}>✓ Resolve</button>
                  </div>
                </>
              )}
              {sel.status==="Resolved"&&<div className="badge bg" style={{padding:"8px 14px"}}>✅ This ticket is resolved</div>}
            </>
          ):(
            <div className="empty"><div className="eico">🎫</div><div className="etitle">No ticket selected</div><div className="esub">Click a row to view details</div></div>
          )}
        </div>
      </div>

      {showM&&(
        <Modal title="New Ticket" onClose={()=>setShowM(false)}
          footer={<><button className="btn btg" onClick={()=>setShowM(false)}>Cancel</button><button className="btn btp" onClick={saveTicket}>Create Ticket</button></>}>
          <div className="g g2 gap3">
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Subject *</label><input className="inp" value={form.subj} onChange={e=>setF("subj",e.target.value)} placeholder="Brief description of issue…"/></div>
            <div className="field"><label className="flbl">Client *</label>
              <select className="inp" value={form.custId} onChange={e=>{const c=customers.find(x=>x.id===e.target.value);setF("custId",e.target.value);setF("client",c?.name||"");}}>
                <option value="">Select client…</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Assigned Agent</label>
              <select className="inp" value={form.agent} onChange={e=>{const emp=employees.find(x=>x.id===e.target.value);setF("agent",e.target.value);setF("agentName",emp?.name||"");}}>
                {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Priority</label>
              <select className="inp" value={form.prio} onChange={e=>setF("prio",e.target.value)}>
                <option>High</option><option>Medium</option><option>Low</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Type</label>
              <select className="inp" value={form.type} onChange={e=>setF("type",e.target.value)}>
                <option>Bug</option><option>Feature</option><option>Perf</option><option>Question</option>
              </select>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// CALENDAR — full event CRUD
// ═══════════════════════════════════════════════════════════════════════════════
function Calendar() {
  const { state, actions } = useApp();
  const [month, setMonth] = useState(new Date(2026,4,1)); // May 2026
  const [showM, setShowM] = useState(false);
  const [selEv, setSelEv] = useState(null);
  const [show, toastEl] = useToast();

  const events = state.calendarEvents || [];
  const employees = state.employees || [];

  const emptyForm = { title:"", start:`${today()}T09:00`, end:`${today()}T10:00`, color:"#6c6cff", type:"meeting", location:"", notes:"", attendees:[] };
  const [form, setForm] = useState(emptyForm);
  const setF=(k,v)=>setForm(p=>({...p,[k]:v}));

  const yr = month.getFullYear(), mo = month.getMonth();
  const daysInMonth = new Date(yr, mo+1, 0).getDate();
  const firstDay = (new Date(yr,mo,1).getDay()+6)%7; // Mon=0
  const monthStr = month.toLocaleString('default',{month:'long',year:'numeric'});
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const EVENT_TYPES = ["meeting","call","demo","review","offsite","other"];

  const getEventsForDay = (d) => {
    const dateStr = `${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    return events.filter(e => e.start?.startsWith(dateStr));
  };

  const todayEvs = getEventsForDay(new Date().getDate());
  const upcomingEvs = events.filter(e=>new Date(e.start)>new Date()).sort((a,b)=>new Date(a.start)-new Date(b.start)).slice(0,5);

  const saveEvent = () => {
    if(!form.title.trim()){show("Title required","r");return;}
    if(!form.start){show("Start time required","r");return;}
    if(selEv){
      actions.updateEvent({...form,id:selEv.id});
      show("Event updated","g");
    } else {
      actions.addEvent({...form,id:`ev_${uid()}`});
      show("Event created","g");
    }
    setShowM(false); setSelEv(null); setForm(emptyForm);
  };

  const deleteEvent=(id)=>{ actions.deleteEvent(id); setSelEv(null); show("Event deleted"); };

  const openEdit=(ev)=>{ setForm({...ev}); setSelEv(ev); setShowM(true); };

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div><h1 className="ptitle">Calendar</h1><p className="psub">{monthStr} · Meetings · Bookings · Shifts · Reminders</p></div>
        <div className="f fa gap2">
          <div className="tabs">{["Month","Week","Day"].map(m=><div key={m} className={`tab ${m==="Month"?"act":""}`}>{m}</div>)}</div>
          <button className="btn btp bsm" onClick={()=>{setForm(emptyForm);setSelEv(null);setShowM(true);}}>+ New Event</button>
        </div>
      </div>
      <div className="g gap4" style={{gridTemplateColumns:"1fr 270px"}}>
        <div className="card" style={{padding:0,overflow:"hidden"}}>
          <div className="f fj fa" style={{padding:"12px 16px",borderBottom:"1px solid var(--bd)"}}>
            <div className="bold">{monthStr}</div>
            <div className="f fa gap2">
              <button className="btn btg bicos" onClick={()=>setMonth(new Date(yr,mo-1,1))}>‹</button>
              <button className="btn btg bsm" onClick={()=>setMonth(new Date(2026,4,1))}>Today</button>
              <button className="btn btg bicos" onClick={()=>setMonth(new Date(yr,mo+1,1))}>›</button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:"var(--bg3)",borderBottom:"1px solid var(--bd)"}}>
            {DAYS.map(d=><div key={d} style={{padding:"10px 6px",textAlign:"center",fontSize:10.5,fontWeight:700,color:"var(--t3)",letterSpacing:".06em"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
            {Array(firstDay).fill(null).map((_,i)=><div key={`e${i}`} style={{borderRight:"1px solid var(--bd)",borderBottom:"1px solid var(--bd)",minHeight:76}}/>)}
            {Array.from({length:daysInMonth},(_,i)=>i+1).map(d=>{
              const isToday = yr===new Date().getFullYear()&&mo===new Date().getMonth()&&d===new Date().getDate();
              const dayEvs = getEventsForDay(d);
              return (
                <div key={d} style={{padding:"8px 6px",borderRight:"1px solid var(--bd)",borderBottom:"1px solid var(--bd)",minHeight:76,cursor:"pointer",transition:"background .1s",background:isToday?"rgba(108,108,255,.07)":undefined}}
                  onMouseEnter={e=>{if(!isToday)e.currentTarget.style.background="var(--sf)";}}
                  onMouseLeave={e=>{if(!isToday)e.currentTarget.style.background="";}}
                  onClick={()=>{setForm({...emptyForm,start:`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}T09:00`,end:`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}T10:00`});setSelEv(null);setShowM(true);}}>

            <div className="tl">

                  <div className="tldot" style={{background:ev.color}}/>{i<arr.length-1&&<div className="tlline"/>}
                  <div className="tlb">
                    <div style={{fontSize:12.5,fontWeight:600}}>{ev.title}</div>
                    <div className="tlm">{ev.start?.slice(11,16)} · {ev.location||ev.type}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card cp">
            <div className="ct mb3">Upcoming Events</div>
            {upcomingEvs.length===0&&<div className="xs t3">No upcoming events</div>}
            {upcomingEvs.map(ev=>(
              <div key={ev.id} className="f fa gap2 cur" style={{padding:"7px 0",borderBottom:"1px solid var(--bd)"}} onClick={()=>openEdit(ev)}>
                <div style={{width:7,height:7,borderRadius:"50%",background:ev.color,flexShrink:0}}/>
                <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{ev.title}</div><div className="xs t3">{ev.start?.slice(0,10)} {ev.start?.slice(11,16)}</div></div>
                <button className="btn btd bxs" onClick={e=>{e.stopPropagation();deleteEvent(ev.id);}}>✕</button>
              </div>

      {showM&&(
        <Modal title={selEv?"Edit Event":"New Event"} onClose={()=>{setShowM(false);setSelEv(null);}} size="mlg"

            {selEv&&<button className="btn btd bsm" onClick={()=>deleteEvent(selEv.id)}>Delete</button>}
            <div style={{flex:1}}/>
            <button className="btn btg" onClick={()=>{setShowM(false);setSelEv(null);}}>Cancel</button>
            <button className="btn btp" onClick={saveEvent}>{selEv?"Save Changes":"Create Event"}</button>
          </>}>
          <div className="g g2 gap3">
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Event Title *</label><input className="inp" value={form.title} onChange={e=>setF("title",e.target.value)} placeholder="e.g. Team Standup"/></div>
            <div className="field"><label className="flbl">Start</label><input className="inp" type="datetime-local" value={form.start} onChange={e=>setF("start",e.target.value)}/></div>
            <div className="field"><label className="flbl">End</label><input className="inp" type="datetime-local" value={form.end} onChange={e=>setF("end",e.target.value)}/></div>
            <div className="field"><label className="flbl">Type</label>
              <select className="inp" value={form.type} onChange={e=>setF("type",e.target.value)}>
                {EVENT_TYPES.map(t=><option key={t}>{t}</option>)}

            </div>
            <div className="field"><label className="flbl">Color</label>
              <div className="f fa gap2 mt1">
                {["#6c6cff","#22c55e","#ef4444","#f59e0b","#06b6d4","#ec4899"].map(c=>(
                  <div key={c} className="cur" onClick={()=>setF("color",c)} style={{width:22,height:22,borderRadius:"50%",background:c,border:`2px solid ${form.color===c?"white":"transparent"}`,transition:"border .1s"}}/>
                ))}
              </div>
            </div>
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Location</label><input className="inp" value={form.location} onChange={e=>setF("location",e.target.value)} placeholder="e.g. Boardroom A, Zoom link…"/></div>
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Notes</label><textarea className="inp" value={form.notes} onChange={e=>setF("notes",e.target.value)} style={{minHeight:60}} placeholder="Agenda, context…"/></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// MESSAGES — real send/receive with channel switching
// ═══════════════════════════════════════════════════════════════════════════════
function Messages() {
  const { state, actions } = useApp();
  const [chId, setChId] = useState("ch1");
  const [msg, setMsg] = useState("");
  const [show, toastEl] = useToast();
  const bottomRef = useRef(null);

  const channels = state.chatChannels || [];
  const allMsgs = state.chatMessages || {};
  const currentUser = state.currentUser || {};
  const curCh = channels.find(c=>c.id===chId);
  const msgs = allMsgs[chId] || [];

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs]);

  const send = () => {
    if(!msg.trim()) return;
    const message = {
      id:`m${Date.now()}`, author:currentUser.name||"You",
      authorId:currentUser.id||"usr_AM",
      text:msg.trim(), time:new Date().toISOString(),
      mine:true,
    };
    actions.sendMessage(chId, message);
    setMsg("");
  };

  const unreadCount = (ch) => {
    const chMsgs = allMsgs[ch.id] || [];
    return chMsgs.filter(m=>m.authorId!==currentUser.id).length > 3 ? 0 : 0;
  };

  return (
    <div className="msgwrap">
      {toastEl}
      <div className="msgsb">
        <div style={{padding:"12px 14px",borderBottom:"1px solid var(--bd)"}}>
          <div className="bold" style={{fontSize:13}}>{state.company?.name||"Nexa Corp"}</div>
          <div className="xs t3">Team Workspace</div>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          <div className="xs t3 upper" style={{padding:"12px 14px 4px"}}>Channels</div>
          {channels.filter(c=>c.type==="channel").map(c=>(
            <div key={c.id} className={`mch ${chId===c.id?"act":""}`} onClick={()=>setChId(c.id)}>
              <div className="mchi">{c.ico}</div>
              <div style={{flex:1,minWidth:0}}>
                <span className="mchn">{c.name}</span>
                <div className="mchl">{(allMsgs[c.id]||[]).slice(-1)[0]?.text||"No messages yet"}</div>
              </div>
            </div>
          ))}
          <div className="xs t3 upper" style={{padding:"12px 14px 4px"}}>Direct Messages</div>
          {channels.filter(c=>c.type==="dm").map(c=>(
            <div key={c.id} className={`mch ${chId===c.id?"act":""}`} onClick={()=>setChId(c.id)}>
              <Av name={c.name} size="md"/>
              <div style={{flex:1,minWidth:0}}>
                <span className="mchn">{c.name}</span>
                <div className="mchl">{(allMsgs[c.id]||[]).slice(-1)[0]?.text||"No messages yet"}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="msgmain">
        <div style={{padding:"10px 18px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",gap:10,background:"var(--bg1)"}}>
          <div className="mchi">{curCh?.ico}</div>
          <div><div className="bold" style={{fontSize:13}}>{curCh?.name}</div><div className="xs t3">{curCh?.type==="dm"?"Direct message":curCh?.members?.length+" members"}</div></div>
          <div style={{flex:1}}/>
          <button className="btn btg bsm">🔍 Search</button>
        </div>
        <div className="chatmsgs">
          {msgs.length===0&&<div className="empty"><div className="eico">💬</div><div className="esub">No messages yet. Say hello!</div></div>}
          {msgs.map((m,i)=>{
            const isMine = m.authorId===currentUser.id||m.mine;
            const showAuthor = !isMine&&(i===0||msgs[i-1]?.authorId!==m.authorId);
            return (
              <div key={m.id} className={`cmsg ${isMine?"mine":""}`}>
                {!isMine&&<Av name={m.author} size="md"/>}
                <div>
                  {showAuthor&&!isMine&&<div className="xs t3 mb1">{m.author}</div>}
                  <div className="cbub">{m.text}</div>
                  <div className="xs t3 mt1" style={{textAlign:isMine?"right":"left"}}>{timeAgo(m.time)}</div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef}/>
        </div>
        <div className="chia">
          <input className="chii" placeholder={`Message ${curCh?.name}…`}
            value={msg} onChange={e=>setMsg(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
          <button className="btn btg bsm">😊</button>
          <button className="btn btp bsm" onClick={send} disabled={!msg.trim()}>Send</button>
        </div>
      </div>
    </div>
  );
}

// MANUFACTURING
// ═══════════════════════════════════════════════════════════════════════════════
function Manufacturing() {
  const [show, toastEl] = useToast();
  const [wos, setWos] = useState([
    {id:"WO-001",name:"Solar Panel Assembly", qty:20,prog:60,due:"2026-05-28",status:"In Progress"},
    {id:"WO-002",name:"CCTV Bundle Packaging",qty:10,prog:40,due:"2026-05-30",status:"In Progress"},

    {id:"WO-004",name:"Meter Calibration",     qty:15,prog:100,due:"2026-05-26",status:"Done"},

    if(w.id!==id)return w;

    <div className="ci">

      <div className="g g3 gap4 mb5">
        {[{l:"Active Work Orders",v:fmtN(wos.filter(w=>w.status==="In Progress").length),ico:"⚙️",c:"#6c6cff"},{l:"BOMs Configured",v:"24",ico:"📋",c:"#06b6d4"},{l:"Quality Pass Rate",v:"95%",ico:"✅",c:"#22c55e"}].map(s=>(
          <div key={s.l} className="stat"><div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div><div className="slb">{s.l}</div><div className="sv" style={{fontSize:24}}>{s.v}</div></div>
        ))}
      </div>
      <div className="g gap4" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div className="card cp">
          <div className="ct mb4">Active Work Orders</div>
          {wos.map(wo=>(
            <div key={wo.id} style={{padding:"13px 0",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",gap:14}}>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{wo.name}</div><div className="xs t3">{wo.id} · Qty: {wo.qty} · Due: {wo.due}</div></div>
              <div style={{width:130}}><div className="f fa gap2"><Prog v={wo.prog}/><span className="xs bold">{wo.prog}%</span></div></div>
              <Bdg s={wo.status}/>
              {wo.status!=="Done"&&<button className="btn btg bxs" onClick={()=>{advance(wo.id);show(`${wo.id} advanced +20%`,"g");}}>+20%</button>}
            </div>
          ))}
        </div>
        <div className="card cp">
          <div className="ct mb4">Bills of Materials</div>
          {[{name:"Solar Panel 250W",comps:8,ver:"v2.1"},{name:"CCTV Bundle 8-cam",comps:12,ver:"v1.3"},{name:"4G Router Pro",comps:6,ver:"v3.0"},{name:"Electricity Meter",comps:15,ver:"v1.0"}].map(bom=>(
            <div key={bom.name} className="mrow">
              <div><div style={{fontSize:13,fontWeight:600}}>{bom.name}</div><div className="xs t3">{bom.comps} components · {bom.ver}</div></div>
              <div className="f fa gap2"><span className="badge bgr xs">{bom.ver}</span><button className="btn btg bxs" onClick={()=>show(`Opened ${bom.name} BOM`)}>Edit</button></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ANALYTICS — computed from real state
// ═══════════════════════════════════════════════════════════════════════════════
function Analytics() {
  const { state } = useApp();
  const sel = useSelectors();
  const [period, setPeriod] = useState("2026");
  const [show, toastEl] = useToast();

  const invoices = state.invoices||[];
  const leads = state.leads||[];
  const posOrders = state.posOrders||[];

  const monthlyRev = useMemo(()=>{
    const b=Array(12).fill(0);
    invoices.filter(i=>i.status==="Paid"&&i.paidAt).forEach(i=>{b[new Date(i.paidAt).getMonth()]+=i.total;});
    posOrders.forEach(o=>{b[new Date(o.createdAt).getMonth()]+=o.total;});
    return b;
  },[invoices,posOrders]);

  const mosSh=["J","F","M","A","M","J","J","A","S","O","N","D"];

  // Revenue by category (from products on invoices)
  const revByCat = useMemo(()=>{
    const cats={};
    invoices.filter(i=>i.status==="Paid").forEach(i=>(i.lines||[]).forEach(l=>{
      const prod=(state.products||[]).find(p=>p.id===l.prodId);
      const cat=prod?.cat||"Other";
      cats[cat]=(cats[cat]||0)+l.qty*l.price;
    }));
    return Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);
  },[invoices,state.products]);

  const topCust = useMemo(()=>{
    const map={};
    invoices.filter(i=>i.status==="Paid").forEach(i=>{map[i.custName]=(map[i.custName]||0)+i.total;});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3);
  },[invoices]);

  const margin = sel.totalRevenue>0?Math.round(((sel.totalRevenue-sel.totalExpenses)/sel.totalRevenue)*100):0;

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div><h1 className="ptitle">Analytics</h1><p className="psub">Business intelligence · Predictive insights · Custom reports</p></div>
        <div className="f fa gap2">
          <div className="tabs">{["2026","Q2 2026","MTD"].map(p=><div key={p} className={`tab ${period===p?"act":""}`} onClick={()=>setPeriod(p)}>{p}</div>)}</div>
          <button className="btn btg bsm" onClick={()=>show("Report exported","g")}>📤 Export</button>
        </div>
      </div>
      <div className="g g4 gap4 mb5">
        {[
          {l:"Total Revenue",   v:fmt(sel.totalRevenue), chg:"+18.4%", c:"#6c6cff"},
          {l:"Net Profit Margin",v:`${margin}%`,          chg:"+2.1pp", c:"#22c55e"},
          {l:"Total Invoices",  v:fmtN(invoices.length), chg:"+12.1%", c:"#06b6d4"},
          {l:"Win Rate",        v:`${sel.winRate}%`,      chg:"+5%",    c:"#f59e0b"},
        ].map(s=>(
          <div key={s.l} className="stat"><div className="slb">{s.l}</div><div className="sv" style={{fontSize:20}}>{s.v}</div><div className="sc up">↑ {s.chg}</div></div>
        ))}
      </div>
      <div className="g gap4 mb4" style={{gridTemplateColumns:"2fr 1fr"}}>
        <div className="card cp">
          <div className="f fj fa mb4"><div><div className="ct">Revenue Trend</div><div className="csub">Monthly · FY {period}</div></div></div>
          <BarChart data={monthlyRev} labels={mosSh} h={150}/>
        </div>
        <div className="card cp">
          <div className="ct mb4">Revenue by Category</div>
          {revByCat.length===0&&<div className="xs t3">No paid invoices yet</div>}
          {revByCat.map(([cat,val],i)=>{
            const colors=["#6c6cff","#22c55e","#06b6d4","#f59e0b"];
            const pct=sel.totalRevenue>0?Math.round((val/sel.totalRevenue)*100):0;
            return (
              <div key={cat} style={{marginBottom:12}}>
                <div className="f fj mb1"><div className="f fa gap1 xs"><div className="dot" style={{background:colors[i]}}/><span className="t2">{cat}</span></div><span className="mono xs bold">{fmt(val)}</span></div>
                <Prog v={pct} color={colors[i]} sm/>
              </div>
            );
          })}
          {revByCat.length>0&&<div className="xs t3 mt2 mono">Total: {fmt(sel.totalRevenue)}</div>}
        </div>
      </div>
      <div className="g g3 gap4">
        <div className="card cp">
          <div className="ct mb3">🏆 Top Customers</div>
          {topCust.length===0&&<div className="xs t3">No data yet</div>}
          {topCust.map(([name,val],i)=>(
            <div key={name} className="mrow">
              <div className="f fa gap2"><span className="mono xs t3">#{i+1}</span><Av name={name} size="sm"/><span className="xs semi">{name}</span></div>
              <span className="mono xs bold">{fmt(val)}</span>
            </div>
          ))}
        </div>
        <div className="card cp">
          <div className="ct mb3">📊 Pipeline Summary</div>
          {[
            {l:"Total Pipeline",   v:fmt(sel.pipelineValue)},
            {l:"Won (Month)",      v:fmt(sel.wonValue)},
            {l:"Active Leads",     v:fmtN(leads.filter(l=>!["Won","Lost"].includes(l.stage)).length)},
            {l:"Win Rate",         v:`${sel.winRate}%`},
          ].map(r=><div key={r.l} className="mrow"><span className="xs t2">{r.l}</span><span className="mono xs bold">{r.v}</span></div>)}
        </div>
        <div className="card cp">
          <div className="ct mb3">💰 Financial KPIs</div>
          {[
            {l:"Revenue",     v:fmt(sel.totalRevenue)},
            {l:"Expenses",    v:fmt(sel.totalExpenses)},
            {l:"Net Profit",  v:fmt(sel.totalRevenue-sel.totalExpenses)},
            {l:"Margin",      v:`${margin}%`},
          ].map(r=><div key={r.l} className="mrow"><span className="xs t2">{r.l}</span><span className="mono xs bold">{r.v}</span></div>)}
        </div>
      </div>
    </div>
  );
}

// DOCUMENTS — upload sim, real tag filtering, delete
// ═══════════════════════════════════════════════════════════════════════════════
function Documents() {
  const { state, actions } = useApp();
  const [search, setSearch] = useState("");
  const [tag, setTag] = useState("All");
  const [show, toastEl] = useToast();
  const fileRef = useRef(null);

  const docs = state.docs||[];
  const allTags=["All",...Array.from(new Set(docs.flatMap(d=>d.tags||[])))];
  const filt=docs.filter(d=>(tag==="All"||(d.tags||[]).includes(tag))&&d.name.toLowerCase().includes(search.toLowerCase()));

  const handleUpload=(e)=>{
    const files=Array.from(e.target.files||[]);
    files.forEach(f=>{
      const ext=f.name.split(".").pop().toUpperCase();
      actions.addDoc({
        id:`doc_${uid()}`,name:f.name.replace(/\.[^.]+$/,""),type:ext,
        size:`${(f.size/1048576).toFixed(1)} MB`,date:today(),
        ico:ext==="PDF"?"📄":ext==="DOCX"?"📝":ext==="PPTX"?"📊":"📎",
        tags:["uploaded"],uploadedBy:state.currentUser?.id||"usr_AM",
      });
    });
    show(`${files.length} file(s) uploaded`,"g");
    e.target.value="";
  };

  return (
    <div className="ci">
      {toastEl}
      <input ref={fileRef} type="file" multiple style={{display:"none"}} onChange={handleUpload}/>
      <div className="ph">
        <div><h1 className="ptitle">Documents</h1><p className="psub">File management · OCR · Tags · Previews · Version control</p></div>
        <div className="f fa gap2">
          <button className="btn btg bsm" onClick={()=>show("Folder created","g")}>📁 New Folder</button>
          <button className="btn btp bsm" onClick={()=>fileRef.current?.click()}>+ Upload</button>
        </div>
      </div>
      <div className="f fa gap3 mb4 fw">
        <input className="inp" style={{maxWidth:280}} placeholder="🔍 Search documents…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="f fa gap1 fw">{allTags.map(t=><button key={t} className={`btn bsm ${tag===t?"btp":"btg"}`} onClick={()=>setTag(t)}>{t}</button>)}</div>
      </div>
      {filt.length===0&&<div className="empty"><div className="eico">🗂️</div><div className="etitle">No documents found</div><div className="esub">Upload files or adjust your filter</div></div>}
      <div className="gauto g gap3">
        {filt.map(d=>(
          <div key={d.id} className="card cp" style={{transition:"all .14s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="var(--sh)";}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
            <div style={{fontSize:32,marginBottom:10}}>{d.ico}</div>
            <div className="bold" style={{fontSize:13,marginBottom:3}}>{d.name}</div>
            <div className="xs t3 mb2">{d.type} · {d.size}</div>
            <div className="f fa gap1 fw mb2">{(d.tags||[]).map(t=><span key={t} className="badge bgr" style={{fontSize:9}}>{t}</span>)}</div>
            <div className="f fj xs t3">
              <span>{d.date}</span>
              <div className="f gap1">
                <button className="btn btg bxs" onClick={()=>show(`Opening ${d.name}…`)}>View</button>
                <button className="btn btd bxs" onClick={()=>{ actions.deleteDoc(d.id); show("Deleted"); }}>🗑</button>

}

// AI ASSISTANT — context-aware, reads real state
// ═══════════════════════════════════════════════════════════════════════════════
function AIAssistant() {
  const { state } = useApp();
  const sel = useSelectors();
  const [msgs, setMsgs] = useState([{
    role:"ai",
    text:`Hello ${state.currentUser?.name?.split(" ")[0]||"there"}! 👋 I'm NexaAI — your enterprise AI with full access to ${state.company?.name||"your company"} data.\n\nI can see:\n• ${state.invoices?.length||0} invoices (${fmt(sel.totalRevenue)} collected)\n• ${(state.leads||[]).filter(l=>!["Won","Lost"].includes(l.stage)).length} active CRM leads (${fmt(sel.pipelineValue)} pipeline)\n• ${state.employees?.length||0} employees (${fmt(sel.payrollNet)} net payroll)\n• ${sel.lowStockItems.length} low-stock alerts\n• ${(state.tickets||[]).filter(t=>t.status!=="Resolved").length} open support tickets\n\nWhat would you like to analyze?`,
    time:new Date().toISOString()
  }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const ref = useRef(null);

  const suggestions = [
    "Show revenue summary","Which invoices are overdue?","What's our win rate?",
    "List low stock items","Summarize payroll costs","Who are the top customers?",
    "How many open tickets?","What projects are in progress?",
  ];

  const getAnswer = (q) => {
    const l = q.toLowerCase();
    const invoices = state.invoices||[];
    const leads = state.leads||[];
    const employees = state.employees||[];
    const tickets = state.tickets||[];
    const projects = state.projects||[];

    if(l.includes("revenue")||l.includes("sales")||l.includes("income")) {
      const paid = invoices.filter(i=>i.status==="Paid");
      const top = paid.reduce((m,i)=>{ m[i.custName]=(m[i.custName]||0)+i.total; return m; },{});
      const topCust = Object.entries(top).sort((a,b)=>b[1]-a[1])[0];
      return `📊 **Revenue Summary**\n\nTotal collected: **${fmt(sel.totalRevenue)}**\nOutstanding: **${fmt(sel.outstanding)}**\nOverdue: **${fmt(sel.overdue)}**\nTotal invoices: **${invoices.length}**\n\nTop customer: **${topCust?topCust[0]:"N/A"}** (${topCust?fmt(topCust[1]):"—"})\n\nProfit margin: **~${Math.round(((sel.totalRevenue-sel.totalExpenses)/Math.max(sel.totalRevenue,1))*100)}%**`;
    }
    if(l.includes("overdue")||l.includes("unpaid")) {
      const ov = invoices.filter(i=>i.status==="Overdue");
      if(ov.length===0) return "✅ Great news — no overdue invoices right now!";
      return `⚠️ **${ov.length} Overdue Invoice${ov.length>1?"s":""}**\n\n${ov.map(i=>`• ${i.id} — ${i.custName} — **${fmt(i.total)}** (due ${i.due})`).join("\n")}\n\nTotal overdue: **${fmt(ov.reduce((s,i)=>s+i.total,0))}**\n\n💡 I recommend sending payment reminders immediately.`;
    }
    if(l.includes("lead")||l.includes("pipeline")||l.includes("crm")) {
      const active = leads.filter(l=>!["Won","Lost"].includes(l.stage));
      const won = leads.filter(l=>l.stage==="Won");
      return `🎯 **CRM Pipeline**\n\nActive leads: **${active.length}** (${fmt(sel.pipelineValue)} total value)\nWon: **${won.length}** (${fmt(sel.wonValue)})\nWin rate: **${sel.winRate}%**\n\nHot deals:\n${leads.filter(l=>l.stage==="Negotiation").map(l=>`• ${l.company} — ${fmt(l.val)} (${l.prob}% probability)`).join("\n")||"• None in negotiation yet"}\n\n💡 ${leads.filter(l=>l.stage==="Proposal").length} proposals awaiting response.`;
    }
    if(l.includes("stock")||l.includes("inventory")) {
      const low = sel.lowStockItems;
      if(low.length===0) return "✅ All inventory levels are above minimum thresholds.";
      return `📦 **${low.length} Low Stock Alert${low.length>1?"s":""}**\n\n${low.map(i=>`• ${i.name}: **${i.qty} units** remaining (min: ${i.minStock})`).join("\n")}\n\nTotal stock value: **${fmt(sel.stockValue)}**\n\n💡 Consider placing reorder for the items above.`;
    }
    if(l.includes("payroll")||l.includes("salary")||l.includes("employee")) {
      return `👥 **HR & Payroll Summary**\n\nTotal employees: **${employees.length}**\nOn leave: **${employees.filter(e=>e.status==="On Leave").length}**\n\nPayroll breakdown:\n• Gross: **${fmt(sel.payrollGross)}**\n• PAYE: **${fmt(sel.payrollPAYE)}**\n• NHIF: **${fmt(sel.payrollNHIF)}**\n• NSSF: **${fmt(sel.payrollNSSF)}**\n• **Net payroll: ${fmt(sel.payrollNet)}**\n\nHighest earner: ${employees.sort((a,b)=>b.sal-a.sal)[0]?.name} (${fmt(employees[0]?.sal||0)})`;
    }
    if(l.includes("ticket")||l.includes("support")||l.includes("helpdesk")) {
      const open=tickets.filter(t=>t.status==="Open");
      const high=tickets.filter(t=>t.prio==="High"&&t.status!=="Resolved");
      return `🎫 **Helpdesk Status**\n\nOpen tickets: **${open.length}**\nHigh priority: **${high.length}**\nResolved: **${tickets.filter(t=>t.status==="Resolved").length}**\n\n${high.length>0?`🚨 Urgent:\n${high.map(t=>`• ${t.id}: ${t.subj} (${t.client})`).join("\n")}`:"✅ No high-priority tickets."}`;
    }
    if(l.includes("project")||l.includes("task")) {
      const active=projects.filter(p=>p.status==="In Progress");
      return `📋 **Projects Overview**\n\nTotal projects: **${projects.length}**\nActive: **${active.length}**\nCompleted: **${projects.filter(p=>p.status==="Done").length}**\n\nActive projects:\n${active.map(p=>`• ${p.name} (${p.client}) — due ${p.deadline}`).join("\n")||"None"}\n\nTotal tasks: ${(state.tasks||[]).length}\nCompleted tasks: ${(state.tasks||[]).filter(t=>t.status==="Done").length}`;
    }
    if(l.includes("customer")||l.includes("client")||l.includes("top")) {
      const custRev={};
      invoices.filter(i=>i.status==="Paid").forEach(i=>{custRev[i.custName]=(custRev[i.custName]||0)+i.total;});
      const sorted=Object.entries(custRev).sort((a,b)=>b[1]-a[1]);
      return `🏆 **Top Customers by Revenue**\n\n${sorted.slice(0,5).map(([n,v],i)=>`${i+1}. **${n}** — ${fmt(v)}`).join("\n")||"No paid invoices yet."}\n\nTotal active customers: **${state.customers?.length||0}**\n\nCustomer Lifetime Value avg: ${sorted.length>0?fmt(sorted.reduce((s,[,v])=>s+v,0)/sorted.length):"—"}`;
    }
    return `I've analyzed your ${state.company?.name} data. Based on current records:\n\n• Revenue: **${fmt(sel.totalRevenue)}** collected\n• Pipeline: **${fmt(sel.pipelineValue)}** active\n• ${sel.lowStockItems.length} low-stock alerts\n• ${tickets.filter(t=>t.status!=="Resolved").length} open support tickets\n\nTry asking: "Show revenue summary", "Which invoices are overdue?", or "What's our pipeline?"`;
  };

  const send = async () => {
    if(!input.trim()||loading) return;
    const q = input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text:q,time:new Date().toISOString()}]);
    setLoading(true);
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),50);
    await new Promise(r=>setTimeout(r,800+Math.random()*600));
    const answer = getAnswer(q);
    setMsgs(p=>[...p,{role:"ai",text:answer,time:new Date().toISOString()}]);
    setLoading(false);
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),50);
  };

  return (
    <div className="aiwrap">
      <div style={{padding:"12px 20px",borderBottom:"1px solid var(--bd)",background:"var(--bg1)",display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,var(--a),var(--a2))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,boxShadow:"0 0 14px rgba(108,108,255,.4)"}}>🤖</div>
        <div><div className="bold" style={{fontSize:13}}>NexaAI</div><div className="xs t3">Live data · {state.company?.name} context</div></div>
        <div style={{flex:1}}/>
        <span className="badge bg pulse">● Online</span>
        <button className="btn btg bsm" onClick={()=>setMsgs([{role:"ai",text:"Chat cleared. How can I help?",time:new Date().toISOString()}])}>🗑️ Clear</button>
      </div>
      <div className="aimsgs">
        {msgs.map((m,i)=>(
          <div key={i} className={`aimsg ${m.role==="user"?"usr":""}`}>
            {m.role==="ai"&&<div className="aiico">🤖</div>}
            <div>
              <div className="aibub" style={{whiteSpace:"pre-wrap"}}>{m.text.replace(/\*\*(.*?)\*\*/g,"$1")}</div>
              <div className="xs t3 mt1" style={{textAlign:m.role==="user"?"right":"left"}}>{timeAgo(m.time)}</div>
            </div>
          </div>
        ))}
        {loading&&<div className="aimsg"><div className="aiico">🤖</div><div className="aibub"><div className="aitype"><span/><span/><span/></div></div></div>}
        <div ref={ref}/>
      </div>
      {msgs.length<=1&&(
        <div style={{padding:"0 20px 8px"}}>
          <div className="xs t3 mb2">Try asking:</div>
          <div className="f fw gap2">{suggestions.map(s=><button key={s} className="btn btg bsm" onClick={()=>setInput(s)}>{s}</button>)}</div>
        </div>
      )}
      <div className="aiia">
        <textarea className="aiinp" rows={1} placeholder="Ask NexaAI about your business data…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
        <button className="btn btp" onClick={send} disabled={!input.trim()||loading} style={{padding:"9px 14px"}}>{loading?<span className="spin" style={{fontSize:16}}>⟳</span>:"Send ↵"}</button>
      </div>
    </div>
  );
}

// ROOT APP SHELL
// ═══════════════════════════════════════════════════════════════════════════════
function NexaERP() {
  const { state, actions } = useApp();
  const sel = useSelectors();

  const [active,    setActive]    = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [cmd,       setCmd]       = useState(false);
  const [offline,   setOffline]   = useState(!navigator.onLine);
  const [mobOpen,   setMobOpen]   = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [userOpen,  setUserOpen]  = useState(false);
  const [toast,     setToast]     = useState(null);

  // ── Online / Offline detection ─────────────────────────────────────────────
  useEffect(() => {
    const onOnline  = () => { setOffline(false); showToast("🟢 Back online — syncing…","g"); };
    const onOffline = () => { setOffline(true);  showToast("📡 Offline — changes saved locally","am"); };
    window.addEventListener("online",  onOnline);
    window.addEventListener("offline", onOffline);
    return () => { window.removeEventListener("online",onOnline); window.removeEventListener("offline",onOffline); };
  }, []);

  // ── Global keyboard shortcuts ──────────────────────────────────────────────
  useEffect(() => {
    const h = e => {
      if ((e.metaKey||e.ctrlKey) && e.key==="k") { e.preventDefault(); setCmd(c=>!c); }
      if ((e.metaKey||e.ctrlKey) && e.key==="/")  { e.preventDefault(); setCollapsed(c=>!c); }
      if (e.key==="Escape") { setCmd(false); setNotifOpen(false); setUserOpen(false); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const showToast = (msg, type="b") => {
    setToast({msg,type});
    setTimeout(() => setToast(null), 3800);
  };

  const nav = useCallback((mod) => {
    setActive(mod);
    setMobOpen(false);
    setNotifOpen(false);
    setUserOpen(false);
  }, []);

  // ── If not authenticated → show login ────────────────────────────────────
  if (!state.isAuthenticated) {
    return <LoginScreen />;
  }

  const grouped   = SECS.map(s => ({ sec:s, items:MODS.filter(m=>m.sec===s) }));
  const bottomMods = MODS.filter(m=>!m.sec);
  const View       = VIEWS[active] || Dashboard;
  const activeMod  = MODS.find(m=>m.id===active);
  const nopad      = ["pos","messages","ai","crm","projects"].includes(active);

  // Dynamic badges from live state
  const getBadge = (id) => {
    if (id==="crm")       return (state.leads||[]).filter(l=>!["Won","Lost"].includes(l.stage)).length||null;
    if (id==="helpdesk")  return (state.tickets||[]).filter(t=>t.status!=="Resolved").length||null;
    if (id==="messages")  return sel.unreadNotifs||null;
    if (id==="inventory") return sel.lowStockItems.length||null;
    return null;
  };

  const toastBg    = toast?.type==="g"?"var(--g)":toast?.type==="r"?"var(--r)":toast?.type==="am"?"var(--am)":"var(--a)";
  const toastColor = toast?.type==="am"?"#000":"white";

  const notifications = state.notifications||[];
  const unread = notifications.filter(n=>!n.read).length;

  return (
    <>
      <style dangerouslySetInnerHTML={{__html: CSS_STYLES}}/>
      <div className="app">

        {/* ── Mobile overlay ── */}
        {mobOpen && (
          <div onClick={()=>setMobOpen(false)}
            style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:199}}/>
        )}

        {/* ════════════════════ SIDEBAR ════════════════════ */}
        <div className={`sb${collapsed?" col":""}${mobOpen?" mob":""}`}>

          {/* Logo / collapse toggle */}
          <div className="lwrap" onClick={()=>setCollapsed(c=>!c)} title="Toggle sidebar (⌘/)">
            <div className="lmark">N</div>
            <span className="ltxt">NexaERP</span>
            <span className="lbadge">ENTERPRISE</span>
          </div>

          {/* Nav scroll */}
          <div className="sscroll noscroll">
            {grouped.map(g => (
              <div key={g.sec} className="ssection">
                <div className="ssec">{g.sec}</div>
                {g.items.map(m => {
                  const badge = getBadge(m.id);
                  return (
                    <div key={m.id}
                      className={`sit${active===m.id?" act":""}`}
                      onClick={() => nav(m.id)}
                      title={m.l}>
                      <span className="sico">{m.ico}</span>
                      <span className="slbl">{m.l}</span>
                      {badge>0 && (
                        <span className={`sbadge ${m.id==="helpdesk"?"rd":m.id==="inventory"?"am":""}`}>
                          {badge}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* Bottom */}
          <div className="sbot">
            {bottomMods.map(m => (
              <div key={m.id}
                className={`sit${active===m.id?" act":""}`}
                onClick={() => nav(m.id)}
                title={m.l}>
                <span className="sico">{m.ico}</span>
                <span className="slbl">{m.l}</span>
              </div>
            ))}

            {/* User pill */}
            <div className="upill rel" onClick={() => setUserOpen(o=>!o)}>
              <Av name={state.currentUser?.name||"?"} size="md"/>
              <div className="uinf">
                <div className="uname">{state.currentUser?.name}</div>
                <div className="urole">{state.currentUser?.role}</div>
              </div>
              <div className="odot"/>

              {userOpen && (
                <div className="drop" style={{bottom:"calc(100% + 6px)",left:0,right:0}}>
                  <div style={{padding:"10px 12px",borderBottom:"1px solid var(--bd)"}}>
                    <div className="bold xs">{state.currentUser?.name}</div>
                    <div className="xs t3">{state.currentUser?.email}</div>
                  </div>
                  <div className="di" onClick={()=>nav("settings")}>👤 My Profile</div>
                  <div className="di" onClick={()=>nav("settings")}>⚙️ Preferences</div>
                  <div className="di" onClick={()=>nav("settings")}>🔒 Security</div>
                  <div className="dsep"/>
                  <div className="di" style={{color:"var(--r)"}}
                    onClick={()=>{ actions.logout(); setUserOpen(false); }}>
                    ↪ Sign Out
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* ════════════════════ MAIN ════════════════════ */}
        <div className="main">

          {/* ── Topbar ── */}
          <div className="topbar">
            <div className="tbl">
              <button className="btn btg bico" id="mob-btn"
                style={{display:"none"}}
                onClick={() => setMobOpen(o=>!o)}>☰</button>
              <div className="bc">
                <span className="t3">NexaERP</span>
                <span className="bcsep t3">/</span>
                <span className="bccur">{activeMod?.l}</span>
              </div>
            </div>

            <div className="strig" onClick={() => setCmd(true)}>
              <span style={{fontSize:14,color:"var(--t3)"}}>⌕</span>
              <span>Search everything…</span>
              <span className="kbd">⌘K</span>
            </div>

            <div className="tbr">
              {offline && (
                <span className="badge bam pulse">📡 Offline</span>
              )}

              {/* Notifications */}
              <div className="rel">
                <button className="btn btg bico"
                  onClick={() => { setNotifOpen(o=>!o); setUserOpen(false); }}
                  title="Notifications">
                  🔔
                  {unread>0 && <div className="ndot"/>}
                </button>

                {notifOpen && (
                  <div className="drop"
                    style={{right:0,top:"calc(100% + 6px)",width:320}}
                    onClick={() => setNotifOpen(false)}>
                    <div className="f fj fa"
                      style={{padding:"10px 14px",borderBottom:"1px solid var(--bd)"}}>
                      <span className="bold xs">Notifications</span>
                      <div className="f fa gap2">
                        {unread>0 && <span className="badge br xs">{unread} new</span>}
                        <button className="btn btg bxs"
                          onClick={e=>{e.stopPropagation();actions.markAllRead();showToast("All read","g");}}>
                          Mark all read
                        </button>
                      </div>
                    </div>
                    {notifications.slice(0,8).map((n,i) => (
                      <div key={n.id}
                        className="di cur"
                        style={{
                          flexDirection:"column",alignItems:"flex-start",gap:2,
                          opacity:n.read?.6:1,
                          background:n.read?"transparent":"rgba(108,108,255,.05)",
                        }}
                        onClick={e=>{e.stopPropagation();actions.markNotifRead(n.id);nav(n.link||"dashboard");setNotifOpen(false);}}>
                        <div style={{fontSize:12,fontWeight:n.read?400:600}}>{n.text}</div>
                        <div className="xs t3">{timeAgo(n.time)}</div>
                      </div>
                    ))}
                    {notifications.length===0 && (
                      <div className="xs t3" style={{padding:"16px 14px"}}>No notifications</div>
                    )}
                  </div>
                )}
              </div>

              <button className="btn btg bico" title="Dark Mode"
                onClick={()=>showToast("Already in dark mode 🌙","b")}>🌙</button>
              <button className="btn btp bsm" onClick={() => setCmd(true)}>⌘K</button>
            </div>
          </div>

          {/* ── Content area ── */}
          <div className={`content${nopad?" ci np":""}`}>
            <View nav={nav}/>
          </div>
        </div>

        {/* ── Command Palette ── */}
        {cmd && <CmdPalette onClose={()=>setCmd(false)} onNav={nav}/>}

        {/* ── Toast ── */}
        {toast && (
          <div style={{
            position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",
            background:toastBg,color:toastColor,
            borderRadius:20,padding:"9px 20px",fontSize:12.5,fontWeight:700,
            zIndex:9999,boxShadow:"var(--shlg)",
            animation:"sUp .3s var(--ease)",whiteSpace:"nowrap",pointerEvents:"none",
          }}>
            {toast.msg}
          </div>
        )}

        {/* ── Mobile menu button visible on small screens ── */}
        <style>{`@media(max-width:780px){#mob-btn{display:flex!important}}`}</style>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// TOP-LEVEL MOUNT WITH PROVIDER
// ═══════════════════════════════════════════════════════════════════════════════
function App() {
  return (
    <AppProvider>
      <NexaERP/>
    </AppProvider>
  );
}

document.getElementById("loading").style.display = "none";
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
