<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080810" />
  <meta name="description" content="NexaERP — Enterprise Business Operating System" />
  <title>NexaERP — Enterprise Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236c6cff'/><text y='.9em' font-size='70' x='12' font-weight='900' fill='white'>N</text></svg>" />

  <!-- React 18 + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX transform in browser -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    /* Prevent flash of unstyled content */
    html, body { margin: 0; padding: 0; background: #080810; color: #eeeeff; height: 100%; }
    #root { height: 100%; }
    #loading {
      position: fixed; inset: 0; background: #080810;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #9090b8; gap: 16px; z-index: 99999;
    }
    #loading-mark {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #6c6cff, #9b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: white;
      box-shadow: 0 0 30px rgba(108,108,255,0.5);
      animation: pulse-mark 1.5s ease-in-out infinite;
    }
    #loading-text { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    @keyframes pulse-mark { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:0.8} }
  </style>
</head>
<body>
  <!-- Loading screen shown while Babel compiles -->
  <div id="loading">
    <div id="loading-mark">N</div>
    <div id="loading-text">Loading NexaERP…</div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ─── Destructure React hooks from global React ────────────────────────────
    const { useState, useEffect, useCallback, useRef, useReducer, useMemo } = React;



const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root {
    --bg:#080810; --bg1:#0f0f1a; --bg2:#141422; --bg3:#1a1a2e; --bg4:#20203a; --bg5:#26264a;
    --sf:rgba(255,255,255,0.035); --sfh:rgba(255,255,255,0.065);
    --bd:rgba(255,255,255,0.075); --bdh:rgba(255,255,255,0.14); --bda:rgba(108,108,255,0.4);
    --t:#eeeeff; --t2:#9090b8; --t3:#505075; --t4:#303050;
    --a:#6c6cff; --ah:#8080ff; --a2:#9b5cf6; --a3:#06b6d4;
    --g:#22c55e; --gd:#16a34a; --r:#ef4444; --rd:#dc2626;
    --am:#f59e0b; --amd:#d97706; --pk:#ec4899; --or:#f97316;
    --rad:12px; --radsm:8px; --radlg:18px; --radxl:24px;
    --sh:0 4px 24px rgba(0,0,0,0.5); --shlg:0 12px 60px rgba(0,0,0,0.7); --sha:0 0 30px rgba(108,108,255,0.25);
    --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    --sw:248px; --th:54px;
    --ease:cubic-bezier(0.4,0,0.2,1); --spring:cubic-bezier(0.34,1.56,0.64,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;width:100%;overflow:hidden}
  body{font-family:var(--font);background:var(--bg);color:var(--t);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--bdh)}
  ::selection{background:rgba(108,108,255,0.3);color:var(--t)}

  .app{display:flex;height:100vh;overflow:hidden;background:var(--bg)}

  /* SIDEBAR */
  .sb{width:var(--sw);min-width:var(--sw);height:100vh;display:flex;flex-direction:column;background:var(--bg1);border-right:1px solid var(--bd);transition:width .22s var(--ease),min-width .22s var(--ease);z-index:200;overflow:hidden;flex-shrink:0}
  .sb.col{width:58px;min-width:58px}
  .sb.col .slbl,.sb.col .ssec,.sb.col .sbadge,.sb.col .ltxt,.sb.col .lbadge,.sb.col .uinf,.sb.col .uchev{opacity:0;width:0;overflow:hidden;pointer-events:none}
  .sb.col .lwrap{padding:14px 13px}
  .sb.col .sit{padding:8px 19px}
  .sb.col .sit::before{display:none}
  .lwrap{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--bd);cursor:pointer;flex-shrink:0;user-select:none}
  .lmark{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;box-shadow:0 0 18px rgba(108,108,255,0.45)}
  .ltxt{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;transition:opacity .18s}
  .lbadge{font-size:9px;color:var(--a);background:rgba(108,108,255,0.14);padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;transition:opacity .18s}
  .sscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
  .sscroll::-webkit-scrollbar{width:0}
  .ssection{padding:10px 10px 2px}
  .ssec{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--t3);padding:0 7px 5px;text-transform:uppercase;white-space:nowrap;transition:opacity .15s}
  .sit{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 12px;border-radius:var(--radsm);cursor:pointer;color:var(--t2);font-weight:500;font-size:13px;transition:all .14s var(--ease);position:relative;white-space:nowrap;overflow:hidden;margin:1px 4px}
  .sit:hover{background:var(--sfh);color:var(--t)}
  .sit.act{background:rgba(108,108,255,0.13);color:var(--a)}
  .sit.act::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:55%;background:var(--a);border-radius:0 3px 3px 0}
  .sico{font-size:15px;flex-shrink:0;width:18px;text-align:center}
  .slbl{flex:1;transition:opacity .15s;overflow:hidden;white-space:nowrap}
  .sbadge{font-size:10px;font-weight:700;background:var(--a);color:white;padding:1px 6px;border-radius:20px;flex-shrink:0;transition:opacity .15s}
  .sbadge.am{background:var(--am)}.sbadge.rd{background:var(--r)}
  .sbot{padding:8px;border-top:1px solid var(--bd);flex-shrink:0}
  .upill{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radsm);cursor:pointer;transition:background .14s;position:relative}
  .upill:hover{background:var(--sfh)}
  .uinf{flex:1;overflow:hidden;min-width:0;transition:opacity .15s}
  .uname{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .urole{font-size:10.5px;color:var(--t3)}
  .odot{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;box-shadow:0 0 6px var(--g)}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .topbar{height:var(--th);min-height:var(--th);display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--bg1);border-bottom:1px solid var(--bd);z-index:100;flex-shrink:0}
  .tbl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .tbr{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .bc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2)}
  .bcsep{color:var(--t3)}.bccur{color:var(--t);font-weight:700}
  .strig{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radsm);padding:6px 12px;cursor:pointer;transition:all .14s;min-width:180px;max-width:280px}
  .strig:hover{border-color:var(--bdh);background:var(--sfh)}
  .strig span{color:var(--t3);font-size:12.5px;flex:1}
  .kbd{font-family:var(--mono);font-size:9.5px;color:var(--t3);background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .content{flex:1;overflow-y:auto;overflow-x:hidden}
  .ci{padding:22px 24px}
  .ci.np{padding:0}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radsm);font-size:12.5px;font-weight:600;font-family:var(--font);cursor:pointer;border:none;transition:all .13s var(--ease);white-space:nowrap;user-select:none;outline:none;letter-spacing:.01em}
  .btn:active{transform:scale(0.97)}
  .btp{background:var(--a);color:#fff}.btp:hover{background:var(--ah);box-shadow:0 0 22px rgba(108,108,255,0.35)}
  .btg{background:transparent;color:var(--t2);border:1px solid var(--bd)}.btg:hover{background:var(--sfh);color:var(--t);border-color:var(--bdh)}
  .btd{background:rgba(239,68,68,0.12);color:var(--r);border:1px solid rgba(239,68,68,0.2)}.btd:hover{background:rgba(239,68,68,0.2)}
  .bts{background:rgba(34,197,94,0.12);color:var(--g);border:1px solid rgba(34,197,94,0.2)}.bts:hover{background:rgba(34,197,94,0.2)}
  .bta{background:rgba(245,158,11,0.12);color:var(--am);border:1px solid rgba(245,158,11,0.2)}
  .bsm{padding:4px 10px;font-size:11.5px}.bxs{padding:3px 8px;font-size:11px}
  .bico{padding:7px}.bicos{padding:5px}
  .btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

  /* CARDS */
  .card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad);transition:border-color .14s}
  .card:hover{border-color:var(--bdh)}
  .cp{padding:18px 20px}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
  .ct{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
  .csub{font-size:11.5px;color:var(--t3);margin-top:2px}

  /* STATS */
  .stat{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad);padding:18px 20px;transition:all .16s;cursor:default;position:relative;overflow:hidden}
  .stat::after{content:'';position:absolute;bottom:0;right:0;width:80px;height:80px;background:radial-gradient(circle,rgba(108,108,255,0.06) 0%,transparent 70%);pointer-events:none}
  .stat:hover{border-color:var(--bdh);transform:translateY(-1px);box-shadow:var(--sh)}
  .slb{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:7px;letter-spacing:.04em;text-transform:uppercase}
  .sv{font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1}
  .sc{font-size:11px;margin-top:5px;display:flex;align-items:center;gap:3px}
  .sc.up{color:var(--g)}.sc.dn{color:var(--r)}
  .sico{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}

  /* TABLE */
  .tw{overflow-x:auto}.tw.bd{border:1px solid var(--bd);border-radius:var(--rad)}
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--bg3);padding:9px 14px;text-align:left;font-weight:700;font-size:10.5px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer}
  thead th:hover{color:var(--t2)}
  tbody tr{border-bottom:1px solid var(--bd);transition:background .1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--sf)}
  tbody td{padding:10px 14px;color:var(--t2);font-size:13px}
  tbody td:first-child{color:var(--t);font-weight:500}

  /* BADGES */
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .bg{background:rgba(34,197,94,0.12);color:var(--g)}
  .br{background:rgba(239,68,68,0.12);color:var(--r)}
  .bam{background:rgba(245,158,11,0.12);color:var(--am)}
  .bb{background:rgba(108,108,255,0.13);color:var(--a)}
  .bc2{background:rgba(6,182,212,0.12);color:var(--a3)}
  .bpk{background:rgba(236,72,153,0.12);color:var(--pk)}
  .bpu{background:rgba(155,92,246,0.12);color:var(--a2)}
  .bo{background:rgba(249,115,22,0.12);color:var(--or)}
  .bgr{background:var(--sf);color:var(--t3)}

  /* FORMS */
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  .flbl{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:5px;display:block;letter-spacing:.04em;text-transform:uppercase}
  .inp{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radsm);padding:8px 11px;color:var(--t);font-size:13px;font-family:var(--font);transition:all .13s;outline:none;appearance:none}
  .inp:hover{border-color:var(--bdh)}.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(108,108,255,0.1)}
  .inp::placeholder{color:var(--t3)}
  select.inp{cursor:pointer}
  textarea.inp{resize:vertical;min-height:76px;line-height:1.55}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fIn .15s ease}
  .modal{background:var(--bg2);border:1px solid var(--bdh);border-radius:var(--radlg);width:100%;max-width:520px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shlg);animation:sUp .2s var(--ease)}
  .mlg{max-width:760px}.mxl{max-width:980px}
  .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bd);flex-shrink:0}
  .mt{font-size:15px;font-weight:800;letter-spacing:-.3px}
  .mb2{padding:22px;overflow-y:auto;flex:1}
  .mf{padding:14px 22px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0;background:var(--bg2)}

  /* COMMAND PALETTE */
  .cov{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(14px);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
  .cbox{width:100%;max-width:580px;background:var(--bg2);border:1px solid var(--bdh);border-radius:var(--radlg);overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,0.85);animation:sDown .18s var(--ease)}
  .ciw{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--bd)}
  .cinp{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--t);font-family:var(--font)}
  .cinp::placeholder{color:var(--t3)}
  .cres{max-height:400px;overflow-y:auto;padding:6px}
  .cgt{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--t3);padding:8px 14px 4px;text-transform:uppercase}
  .crow{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;border-radius:var(--radsm);transition:background .1s}
  .crow:hover,.crow.sel{background:rgba(108,108,255,0.12)}
  .cico{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .clbl{font-size:13px;font-weight:600}.csub{font-size:11px;color:var(--t3)}
  .cft{display:flex;gap:14px;align-items:center;padding:9px 18px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--t3)}

  /* KANBAN */
  .kan{display:flex;gap:12px;overflow-x:auto;height:100%;padding-bottom:8px}
  .kan::-webkit-scrollbar{height:4px}
  .kcol{min-width:272px;max-width:272px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
  .kch{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-shrink:0}
  .kct{font-size:12.5px;font-weight:700}
  .kcnt{font-size:10.5px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;padding:1px 7px;color:var(--t3)}
  .kcards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
  .kcard{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radsm);padding:11px 13px;cursor:pointer;transition:all .14s}
  .kcard:hover{border-color:var(--bdh);transform:translateY(-1px);box-shadow:var(--sh)}
  .kctitle{font-size:12.5px;font-weight:600;margin-bottom:7px;line-height:1.4}
  .kcft{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .kadd{margin:6px;padding:7px;border-radius:var(--radsm);border:1px dashed var(--bd);text-align:center;font-size:11.5px;color:var(--t3);cursor:pointer;transition:all .13s}
  .kadd:hover{border-color:var(--a);color:var(--a);background:rgba(108,108,255,0.05)}

  /* AVATARS */
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;user-select:none}
  .av-sm{width:22px;height:22px;font-size:9px}
  .av-md{width:30px;height:30px;font-size:11px}
  .av-lg{width:38px;height:38px;font-size:14px}
  .av-xl{width:48px;height:48px;font-size:17px}

  /* PROGRESS */
  .prog{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
  .progb{height:100%;border-radius:3px;transition:width .5s var(--ease);background:linear-gradient(to right,var(--a),var(--a2))}
  .prog.sm{height:3px}

  /* TABS */
  .tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radsm);padding:3px;width:fit-content}
  .tab{padding:5px 13px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .13s;color:var(--t2);white-space:nowrap;user-select:none}
  .tab.act{background:var(--bg1);color:var(--t);box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .tab:hover:not(.act){color:var(--t)}

  /* TOGGLE */
  .tog{width:34px;height:18px;border-radius:9px;background:var(--bg4);border:1px solid var(--bd);cursor:pointer;transition:all .16s;position:relative;flex-shrink:0}
  .tog.on{background:var(--a);border-color:var(--a)}
  .tog::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:white;transition:transform .16s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .tog.on::after{transform:translateX(16px)}

  /* DROPDOWN */
  .drop{position:absolute;background:var(--bg2);border:1px solid var(--bdh);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shlg);z-index:500;min-width:180px;animation:fIn .12s ease}
  .di{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;transition:background .1s;font-size:12.5px;color:var(--t2)}
  .di:hover{background:var(--sfh);color:var(--t)}
  .dsep{height:1px;background:var(--bd);margin:3px 0}

  /* TIMELINE */
  .tl{display:flex;flex-direction:column}
  .tli{display:flex;gap:13px;padding-bottom:18px;position:relative}
  .tli:last-child{padding-bottom:0}
  .tldot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
  .tlline{position:absolute;left:4px;top:13px;bottom:0;width:1px;background:var(--bd)}
  .tli:last-child .tlline{display:none}
  .tlb{flex:1;min-width:0}
  .tlm{font-size:10.5px;color:var(--t3);margin-top:2px}

  /* GRIDS */
  .g{display:grid}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .gauto{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}.gap5{gap:20px}

  /* FLEX */

const AV_COLS = ["#6c6cff","#9b5cf6","#06b6d4","#22c55e","#ec4899","#f97316","#f59e0b","#ef4444"];
const avc = n => AV_COLS[(n?.charCodeAt(0)||0) % AV_COLS.length];

function Av({ name="?", size="md" }) {
  const init = (name||"?").trim().split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const c = avc(name);
  return <div className={`av av-${size}`} style={{background:`linear-gradient(135deg,${c},${c}bb)`}}>{init}</div>;
}

function Bdg({ s }) {
  const m = {
    Paid:"bg",Active:"bg",Done:"bg",Resolved:"bg",Won:"bg",Online:"bg",Closed:"bg",Completed:"bg",Approved:"bg",Sent:"bg",
    Pending:"bam","In Progress":"bb",Planning:"bc2","On Leave":"bam",Scheduled:"bc2",Draft:"bgr",Processing:"bb",
    Overdue:"br",High:"br",Open:"bam",Urgent:"br",Critical:"br",Blocked:"br",
    New:"bpu",Qualified:"bb",Proposal:"bam",Negotiation:"bc2",Medium:"bam",Low:"bgr",Inactive:"bgr",
    Paused:"bam","Low Stock":"bam","In Stock":"bg",Trial:"bo",Cancelled:"br",
  };
  return <span className={`badge ${m[s]||"bgr"}`}>{s}</span>;
}

function Prog({ v=0, color, sm }) {
  return (
    <div className={`prog${sm?" sm":""}`}>
      <div className="progb" style={{width:`${Math.max(0,Math.min(100,v))}%`,background:color?`linear-gradient(to right,${color}99,${color})`:undefined}} />
    </div>
  );
}

function Spark({ data=[], color="#6c6cff", w=80, h=32 }) {
  if (!data.length) return null;
  const mx=Math.max(...data), mn=Math.min(...data), rng=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*(h-5)-2}`).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <defs><linearGradient id={`sg${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity=".25"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#sg${color.replace("#","")})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function BarChart({ data=[], labels=[], h=130 }) {
  const mx=Math.max(...data,1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:5,height:h+18,paddingTop:10}}>
      {data.map((v,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <div style={{width:"100%",borderRadius:"4px 4px 0 0",height:`${Math.max(3,(v/mx)*h)}px`,
            background:`linear-gradient(to top,#6c6cff${i===data.length-1?"ff":"88"},#9b5cf6${i===data.length-1?"ff":"66"})`,
            transition:"height .5s var(--ease)"}}/>
          <span style={{fontSize:9,color:"var(--t3)"}}>{labels[i]}</span>
        </div>
      ))}
    </div>
  );
}

function Donut({ segs=[], size=110 }) {
  const tot=segs.reduce((s,g)=>s+g.v,0)||1;
  let cum=0;
  const r=size/2-14, cx=size/2, cy=size/2, sw=18;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segs.map((seg,i)=>{
        const pct=seg.v/tot, a0=cum*Math.PI*2-Math.PI/2;
        cum+=pct;
        const a1=cum*Math.PI*2-Math.PI/2, laf=pct>.5?1:0;
        const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
        return <path key={i} d={`M${x0} ${y0}A${r} ${r} 0 ${laf} 1 ${x1} ${y1}`} fill="none" stroke={seg.c} strokeWidth={sw} strokeLinecap="round"/>;
      })}
      <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle"
        style={{fontSize:12,fontWeight:800,fill:"var(--t)",fontFamily:"var(--font)"}}>
        {tot.toLocaleString()}
      </text>
    </svg>
  );
}

// ─── COMMAND PALETTE ─────────────────────────────────────────────────────────
function CmdPalette({ onClose, onNav }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const ref = useRef(null);
  const quick = [
    {l:"New Invoice",       sub:"Sales",       ico:"💰",mod:"sales"},
    {l:"New Lead",          sub:"CRM",         ico:"🎯",mod:"crm"},
    {l:"New Employee",      sub:"HR",          ico:"👤",mod:"hr"},
    {l:"Open POS Terminal", sub:"Point of Sale",ico:"🛒",mod:"pos"},
    {l:"New Support Ticket",sub:"Helpdesk",    ico:"🎫",mod:"helpdesk"},
    {l:"Analytics Report",  sub:"Analytics",   ico:"📈",mod:"analytics"},
    {l:"Send Message",      sub:"Messages",    ico:"💬",mod:"messages"},
    {l:"AI Assistant",      sub:"NexaAI",      ico:"🤖",mod:"ai"},
    {l:"Automation Builder",sub:"Automation",  ico:"⚡",mod:"automation"},
    {l:"Settings",          sub:"System",      ico:"⚙️",mod:"settings"},
  ];
  const res = q ? MODS.filter(m=>m.l.toLowerCase().includes(q.toLowerCase())).map(m=>({l:m.l,sub:m.sec||"Module",ico:m.ico,mod:m.id})) : quick;
  useEffect(()=>{ ref.current?.focus(); },[]);
  useEffect(()=>{
    const h=e=>{
      if(e.key==="Escape") onClose();
      if(e.key==="ArrowDown"){e.preventDefault();setSel(s=>Math.min(s+1,res.length-1));}
      if(e.key==="ArrowUp"){e.preventDefault();setSel(s=>Math.max(s-1,0));}
      if(e.key==="Enter"&&res[sel]){onNav(res[sel].mod);onClose();}
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[res,sel,onClose,onNav]);
  return (
    <div className="cov" onClick={onClose}>
      <div className="cbox" onClick={e=>e.stopPropagation()}>
        <div className="ciw">
          <span style={{fontSize:16,color:"var(--t3)"}}>⌕</span>
          <input ref={ref} className="cinp" placeholder="Search modules, actions, records…" value={q} onChange={e=>{setQ(e.target.value);setSel(0);}}/>
          <span className="kbd">Esc</span>
        </div>
        <div className="cres">
          <div className="cgt">{q?`Results for "${q}"`:"Quick Actions"}</div>
          {res.length===0 && <div className="empty" style={{padding:"24px 20px"}}><div className="esub">No results for "{q}"</div></div>}
          {res.map((r,i)=>(
            <div key={r.l} className={`crow ${i===sel?"sel":""}`} onMouseEnter={()=>setSel(i)} onClick={()=>{onNav(r.mod);onClose();}}>
              <div className="cico">{r.ico}</div>
              <div style={{flex:1}}><div className="clbl">{r.l}</div><div className="csub">{r.sub}</div></div>
              {i===sel&&<span className="kbd">↵</span>}
            </div>
          ))}
        </div>
        <div className="cft">
          <span><span className="kbd">↑↓</span> Navigate</span>
          <span><span className="kbd">↵</span> Open</span>
          <span><span className="kbd">⌘K</span> Toggle</span>
        </div>
      </div>
    </div>
  );
}

// ─── POS ─────────────────────────────────────────────────────────────────────
function POS() {
  const [cart,setCart]=useState([]);
  const [search,setSearch]=useState("");
  const [cat,setCat]=useState("All");
  const [payM,setPayM]=useState(false);
  const cats=["All",...Array.from(new Set(D.products.map(p=>p.cat)))];
  const filt=D.products.filter(p=>(cat==="All"||p.cat===cat)&&p.name.toLowerCase().includes(search.toLowerCase()));
  const add=prod=>setCart(prev=>{const ex=prev.find(i=>i.id===prod.id);return ex?prev.map(i=>i.id===prod.id?{...i,qty:i.qty+1}:i):[...prev,{...prod,qty:1}];});
  const setQ=(id,d)=>setCart(prev=>prev.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0));
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const vat=sub*0.16;
  const tot=sub+vat;
  const fmt=v=>`KES ${Math.round(v).toLocaleString()}`;
  return (
    <div className="poswrap">
      <div className="posl">
        <div className="f fj fa mb3"><div><div className="bold lg">Point of Sale</div><div className="xs t3">Session: Morning · Cashier: Alex Morgan</div></div><div className="f fa gap2"><span className="badge bg">● Open</span><button className="btn btg bsm">End Session</button></div></div>
        <input className="inp mb3" placeholder="🔍  Search products or scan barcode…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="f fa gap2 mb3 fw">{cats.map(c=><button key={c} className={`btn bsm ${cat===c?"btp":"btg"}`} onClick={()=>setCat(c)}>{c}</button>)}</div>
        <div className="ppg">
          {filt.map(p=>(
            <div key={p.id} className="pp" onClick={()=>add(p)}>
              <div className="ppico">{p.ico}</div>
              <div className="ppname">{p.name}</div>
              <div className="ppprice">{fmt(p.price)}</div>
              {p.stock<30&&p.stock!==999&&<div className="xs t3 mt1">Stock: {p.stock}</div>}
            </div>
          ))}
        </div>
      </div>
      <div className="posr">
        <div className="pch f fj fa"><span>Current Order</span>{cart.length>0&&<button className="btn btd bxs" onClick={()=>setCart([])}>Clear</button>}</div>
        <div className="pcb">
          {cart.length===0&&<div className="empty"><div className="eico">🛒</div><div className="etitle">Cart is empty</div><div className="esub">Tap products to add them</div></div>}
          {cart.map(item=>(
            <div key={item.id} className="pci">
              <span style={{fontSize:18}}>{item.ico}</span>
              <div className="pcin trunc">{item.name}</div>
              <div className="qw"><div className="qbtn" onClick={()=>setQ(item.id,-1)}>−</div><span className="bold" style={{minWidth:20,textAlign:"center"}}>{item.qty}</span><div className="qbtn" onClick={()=>setQ(item.id,+1)}>+</div></div>
              <div className="mono xs bold t2" style={{minWidth:72,textAlign:"right"}}>KES {(item.price*item.qty).toLocaleString()}</div>
            </div>
          ))}
        </div>
        <div className="pcf">
          <div className="f fj" style={{fontSize:12,color:"var(--t2)",marginBottom:5}}><span>Subtotal</span><span className="mono">{fmt(sub)}</span></div>
          <div className="f fj" style={{fontSize:12,color:"var(--t2)",marginBottom:5}}><span>VAT (16%)</span><span className="mono">{fmt(vat)}</span></div>
          <div className="f fj" style={{fontSize:11,color:"var(--t3)",marginBottom:8}}><span>{cart.length} item{cart.length!==1?"s":""}</span></div>
          <div className="div" style={{margin:"8px 0"}}/>
          <div className="ptot"><span>Total</span><span className="mono">{fmt(tot)}</span></div>
          <div className="fc gap2">
            <button className="btn btp w100" style={{justifyContent:"center",padding:"11px"}} disabled={cart.length===0} onClick={()=>setPayM(true)}>💳  Charge {fmt(tot)}</button>
            <div className="f gap2"><button className="btn btg f1" style={{justifyContent:"center"}}>📱 M-Pesa</button><button className="btn btg f1" style={{justifyContent:"center"}}>💵 Cash</button><button className="btn btg f1" style={{justifyContent:"center"}}>🏦 Bank</button></div>
          </div>
        </div>
      </div>
      {payM&&(
        <div className="ov" onClick={()=>setPayM(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mh"><span className="mt">Payment — {fmt(tot)}</span><button className="btn btg bicos" onClick={()=>setPayM(false)}>✕</button></div>
            <div className="mb2">
              <div className="g g2 gap3">
                {[{ico:"📱",l:"M-Pesa",sub:"Paybill 400200"},{ico:"💳",l:"Card",sub:"Visa/Mastercard"},{ico:"💵",l:"Cash",sub:"Count & confirm"},{ico:"🏦",l:"Bank Transfer",sub:"RTGS / EFT"}].map(m=>(
                  <div key={m.l} className="cur" onClick={()=>{setPayM(false);setCart([]);}} style={{background:"var(--bg3)",border:"1px solid var(--bd)",borderRadius:10,padding:"16px 14px",textAlign:"center",transition:"all .13s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--a)";e.currentTarget.style.background="rgba(108,108,255,.06)";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--bd)";e.currentTarget.style.background="var(--bg3)";}}>
                    <div style={{fontSize:28,marginBottom:8}}>{m.ico}</div><div className="bold">{m.l}</div><div className="xs t3 mt1">{m.sub}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── MESSAGES ────────────────────────────────────────────────────────────────
function Messages() {
  const [ch,setCh]=useState(1);
  const [msg,setMsg]=useState("");
  const [msgs,setMsgs]=useState(D.chatMsgs);
  const ref=useRef(null);
  const curCh=D.channels.find(c=>c.id===ch);
  const send=()=>{
    if(!msg.trim())return;
    setMsgs(prev=>[...prev,{id:Date.now(),author:"Alex Morgan",text:msg.trim(),time:"Now",mine:true}]);
    setMsg("");
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),50);
  };
  return (
    <div className="msgwrap">
      <div className="msgsb">
        <div style={{padding:"12px 14px",borderBottom:"1px solid var(--bd)"}}><div className="bold" style={{fontSize:13}}>Nexa Corp</div><div className="xs t3">Team Workspace</div></div>
        <div style={{flex:1,overflowY:"auto"}}>
          <div className="xs t3 upper" style={{padding:"12px 14px 4px"}}>Channels</div>
          {D.channels.filter(c=>!c.dm).map(c=>(
            <div key={c.id} className={`mch ${ch===c.id?"act":""}`} onClick={()=>setCh(c.id)}>
              <div className="mchi">{c.ico}</div>
              <div style={{flex:1,minWidth:0}}><div className="f fj fa"><span className="mchn">{c.name}</span>{c.unread>0&&<span className="badge bb" style={{fontSize:9}}>{c.unread}</span>}</div><div className="mchl">{c.last}</div></div>
            </div>
          ))}
          <div className="xs t3 upper" style={{padding:"12px 14px 4px"}}>Direct Messages</div>
          {D.channels.filter(c=>c.dm).map(c=>(
            <div key={c.id} className={`mch ${ch===c.id?"act":""}`} onClick={()=>setCh(c.id)}>
              <Av name={c.name} size="md"/>
              <div style={{flex:1,minWidth:0}}><div className="f fj fa"><span className="mchn">{c.name}</span>{c.unread>0&&<span className="badge bb" style={{fontSize:9}}>{c.unread}</span>}</div><div className="mchl">{c.last}</div></div>
            </div>
          ))}
        </div>
      </div>
      <div className="msgmain">
        <div style={{padding:"10px 18px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",gap:10,background:"var(--bg1)"}}>
          <div className="mchi">{curCh?.ico}</div>
          <div><div className="bold" style={{fontSize:13}}>{curCh?.name}</div><div className="xs t3">{curCh?.dm?"Direct message":"Team channel"}</div></div>
          <div style={{flex:1}}/>
          <button className="btn btg bsm">📌 Pins</button>
          <button className="btn btg bsm">🔍 Search</button>
        </div>
        <div className="chatmsgs">
          {msgs.map((m,i)=>(
            <div key={m.id} className={`cmsg ${m.mine?"mine":""}`}>
              {!m.mine&&<Av name={m.author} size="md"/>}
              <div>{!m.mine&&<div className="xs t3 mb1">{m.author}</div>}<div className="cbub">{m.text}</div><div className="xs t3 mt1" style={{textAlign:m.mine?"right":"left"}}>{m.time}</div></div>
            </div>
          ))}
          <div ref={ref}/>
        </div>
        <div className="chia">
          <input className="chii" placeholder={`Message ${curCh?.name}…`} value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
          <button className="btn btg bsm">📎</button>
          <button className="btn btg bsm">😊</button>
          <button className="btn btp bsm" onClick={send} disabled={!msg.trim()}>Send</button>
        </div>
      </div>
    </div>
  );
}

// ─── AI ASSISTANT ─────────────────────────────────────────────────────────────
function AIAssistant() {
  const [msgs,setMsgs]=useState([{role:"ai",text:"Hello Alex! I'm NexaAI — your enterprise AI assistant with full context of Nexa Corp. I can analyze your financials, CRM pipeline, inventory, HR data, and more. How can I help you today?",time:"Just now"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const ref=useRef(null);
  const suggestions=["Show revenue forecast for Q3 2026","Which customers have overdue invoices?","What's the payroll cost this month?","List all low stock items","Summarize CRM pipeline value","Who are the top 3 customers by revenue?"];
  const aiR={
    revenue:"📊 Revenue this month (May 2026) is **KES 4.2M**, up **18.4%** vs April. Your top contributor is Safaricom PLC at KES 2.1M (50% of total). You're at 84% of your KES 5M monthly target. At current trajectory, you'll close at ~KES 4.6M by month-end.",
    invoice:"📄 You have **8 invoices** this month. **5 paid** (KES 3.1M collected), **2 pending** (KES 157.5K), and **1 overdue** — INV-2398 from Jumia Kenya for KES 56.2K, now 5 days past due. I recommend sending a payment reminder immediately.",
    lead:"🎯 Your CRM pipeline has **10 active opportunities** worth **KES 6.3M** combined. 2 deals are in Negotiation — Andela Kenya (KES 560K, 80% probability) and ABSA Kenya (KES 720K). Forecast for the month: **KES 1.64M** weighted value.",
    stock:"📦 **3 inventory alerts**: Dell XPS Laptops (12 units, borderline), CCTV Bundles (18 units, min 10), Office Chairs (28 units, min 8). Most urgent is CCTV Bundles — current stock gives only ~8 days of average demand coverage.",
    payroll:"💰 May 2026 payroll: **KES 1.247M net** (KES 1.515M gross). All 8 employees processed. Deductions: PAYE KES 190K, NSSF KES 36K, NHIF KES 42K. Note: David Ochieng has 5 pending leave days that need approval before June payroll.",
    customer:"🏆 Top 3 customers by revenue: **1. Safaricom PLC** (KES 2.1M) **2. Kenya Power** (KES 395K) **3. Equity Bank** (KES 320K). Together they represent 68% of your total monthly revenue.",
    default:"I've analyzed your Nexa Corp data. I can provide insights on revenue trends, customer health, pipeline forecast, inventory levels, payroll, HR metrics, project status, or helpdesk performance. What would you like to dive into?",
  };
  const send=async()=>{
    if(!input.trim()||loading)return;
    const q=input.trim();setInput("");
    setMsgs(p=>[...p,{role:"user",text:q,time:"Now"}]);
    setLoading(true);
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),50);
    await new Promise(r=>setTimeout(r,1000+Math.random()*800));
    const l=q.toLowerCase();
    const resp=l.includes("revenue")||l.includes("sales")?aiR.revenue:l.includes("invoice")||l.includes("overdue")?aiR.invoice:l.includes("lead")||l.includes("crm")||l.includes("pipeline")?aiR.lead:l.includes("stock")||l.includes("inventory")||l.includes("low")?aiR.stock:l.includes("payroll")||l.includes("salary")||l.includes("employee")?aiR.payroll:l.includes("customer")||l.includes("top")||l.includes("best")?aiR.customer:aiR.default;
    setMsgs(p=>[...p,{role:"ai",text:resp,time:"Just now"}]);
    setLoading(false);
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),50);
  };
  return (
    <div className="aiwrap">
      <div style={{padding:"12px 20px",borderBottom:"1px solid var(--bd)",background:"var(--bg1)",display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,var(--a),var(--a2))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,boxShadow:"0 0 14px rgba(108,108,255,.4)"}}>🤖</div>
        <div><div className="bold" style={{fontSize:13}}>NexaAI</div><div className="xs t3">Enterprise AI · Full business context · GPT-4 powered</div></div>
        <div style={{flex:1}}/>
        <span className="badge bg pulse">● Online</span>
        <button className="btn btg bsm" onClick={()=>setMsgs([{role:"ai",text:"Chat cleared. How can I help?",time:"Now"}])}>🗑️ Clear</button>
      </div>
      <div className="aimsgs">
        {msgs.map((m,i)=>(
          <div key={i} className={`aimsg ${m.role==="user"?"usr":""}`}>
            {m.role==="ai"&&<div className="aiico">🤖</div>}
            <div>
              <div className="aibub" style={{whiteSpace:"pre-wrap"}}>{m.text.replace(/\*\*(.*?)\*\*/g,"$1")}</div>
              <div className="xs t3 mt1" style={{textAlign:m.role==="user"?"right":"left"}}>{m.time}</div>
            </div>
          </div>
        ))}
        {loading&&<div className="aimsg"><div className="aiico">🤖</div><div className="aibub"><div className="aitype"><span/><span/><span/></div></div></div>}
        <div ref={ref}/>
      </div>
      {msgs.length<=1&&(
        <div style={{padding:"0 20px 8px"}}><div className="xs t3 mb2">Suggested questions:</div><div className="f fw gap2">{suggestions.map(s=><button key={s} className="btn btg bsm" onClick={()=>setInput(s)}>{s}</button>)}</div></div>
      )}
      <div className="aiia">
        <textarea className="aiinp" rows={1} placeholder="Ask NexaAI anything about your business…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
        <button className="btn btp" onClick={send} disabled={!input.trim()||loading} style={{padding:"9px 14px"}}>{loading?<span className="spin" style={{fontSize:16}}>⟳</span>:"Send ↵"}</button>
      </div>
    </div>
  );
}

                  {[{l:"Indigo (Default)",c:"#6c6cff"},{l:"Violet",c:"#8b5cf6"},{l:"Cyan",c:"#06b6d4"},{l:"Emerald",c:"#22c55e"},{l:"Rose",c:"#f43f5e"},{l:"Amber",c:"#f59e0b"}].map(t=>(
                    <div key={t.l} className="f fa gap2 cur" style={{padding:"8px 12px",borderRadius:8,border:"1px solid var(--bd)",transition:"border-color .12s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=t.c} onMouseLeave={e=>e.currentTarget.style.borderColor="var(--bd)"}>
                      <div style={{width:14,height:14,borderRadius:"50%",background:t.c}}/><span style={{fontSize:12}}>{t.l}</span>
                    </div>
                  ))}
                </div>
              </div>
              {[{l:"Dark Mode",sub:"Always on dark theme",v:true},{l:"Compact Sidebar",sub:"Collapse nav labels",v:false},{l:"Reduced Motion",sub:"Disable animations",v:false},{l:"High Contrast",sub:"Enhanced accessibility",v:false}].map(p=>(
                <div key={p.l} className="mrow"><div><div style={{fontSize:12.5,fontWeight:700}}>{p.l}</div><div className="xs t3">{p.sub}</div></div><div className={`tog ${p.v?"on":""}`}/></div>
              ))}
            </div>
          )}
          {section==="security"&&(
            <div className="card cp">
              <div className="ct mb5">Security Settings</div>
              {[{l:"Two-Factor Authentication",sub:"TOTP via Google Authenticator or Authy",v:false},{l:"Biometric Login",sub:"Fingerprint / Face ID (PWA only)",v:false},{l:"Session Timeout",sub:"Auto-logout after 30 minutes",v:true},{l:"Audit Logging",sub:"Log all user actions for compliance",v:true},{l:"IP Restriction",sub:"Only allow trusted IP ranges",v:false}].map(p=>(
                <div key={p.l} className="mrow"><div><div style={{fontSize:12.5,fontWeight:700}}>{p.l}</div><div className="xs t3">{p.sub}</div></div><div className={`tog ${p.v?"on":""}`}/></div>
              ))}
              <div className="div"/><button className="btn btd bsm">Change Password</button>
            </div>
          )}
          {section==="api"&&(
            <div className="card cp">
              <div className="ct mb5">API Keys & Webhooks</div>
              <div className="sectitle">API Keys</div>
              <div style={{background:"var(--bg3)",border:"1px solid var(--bd)",borderRadius:8,padding:"12px 14px",marginBottom:12}}>
                <div className="f fj fa mb1"><span className="xs bold">Production API Key</span><span className="badge bg xs">Active</span></div>
                <div className="mono xs t3">nexa_prod_••••••••••••••••••••••••••••••••</div>
                <div className="f gap2 mt2"><button className="btn btg bxs">Reveal</button><button className="btn btg bxs">Regenerate</button></div>
              </div>
              <button className="btn btp bsm mb5">+ Generate New Key</button>
              <div className="sectitle">Webhooks</div>
              <div className="field"><label className="flbl">Webhook URL</label><input className="inp" placeholder="https://your-app.com/webhooks/nexa"/></div>
              <div className="field"><label className="flbl">Subscribe to Events</label>
                <div className="fc gap1 mt1">{["invoice.created","invoice.paid","lead.won","order.created","stock.low"].map(ev=>(
                  <label key={ev} className="f fa gap2 xs"><input type="checkbox" defaultChecked style={{accentColor:"var(--a)"}}/><span className="mono">{ev}</span></label>
                ))}</div>
              </div>
            </div>
          )}
          {section==="shortcuts"&&(
            <div className="card cp">
              <div className="ct mb5">Keyboard Shortcuts</div>
              {[{key:"⌘K",a:"Open command palette"},{key:"⌘/",a:"Toggle sidebar"},{key:"⌘N",a:"New record (context-aware)"},{key:"⌘S",a:"Save current form"},{key:"⌘F",a:"Search in current view"},{key:"⌘1–9",a:"Navigate to module 1–9"},{key:"Esc",a:"Close modal / cancel"},{key:"?",a:"Show all shortcuts"},{key:"G then D",a:"Go to Dashboard"},{key:"G then C",a:"Go to CRM"},{key:"G then I",a:"Go to Invoices"}].map(s=>(
                <div key={s.key} className="mrow"><span style={{fontSize:12.5}}>{s.a}</span><span className="kbd">{s.key}</span></div>
              ))}
            </div>
          )}
          {!["company","appearance","security","api","shortcuts"].includes(section)&&(
            <div className="card cp"><div className="ct mb3">{secs.find(s=>s.id===section)?.l}</div><div className="empty"><div className="eico">{secs.find(s=>s.id===section)?.ico}</div><div className="etitle">{secs.find(s=>s.id===section)?.l}</div><div className="esub">Configure your {(secs.find(s=>s.id===section)?.l||"").toLowerCase()} settings here</div></div></div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── MODULE MAP ───────────────────────────────────────────────────────────────
const VIEWS={
  dashboard:Dashboard,crm:CRM,sales:Sales,accounting:Accounting,
  inventory:Inventory,pos:POS,manufacturing:Manufacturing,projects:Projects,
  hr:HR,helpdesk:Helpdesk,calendar:Calendar,messages:Messages,
  documents:Documents,marketing:Marketing,ecommerce:ECommerce,
  analytics:Analytics,automation:Automation,ai:AIAssistant,settings:Settings,
};

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function NexaERP() {
  const [active,setActive]=useState("dashboard");
  const [collapsed,setCollapsed]=useState(false);
  const [cmd,setCmd]=useState(false);
  const [offline,setOffline]=useState(!navigator.onLine);
  const [mobOpen,setMobOpen]=useState(false);
  const [notifOpen,setNotifOpen]=useState(false);
  const [userOpen,setUserOpen]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    const on=()=>{setOffline(false);showToast("🟢 Back online — syncing data…","g");};
    const off=()=>{setOffline(true);showToast("📡 Offline mode — changes saved locally","am");};
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);

  useEffect(()=>{
    const h=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setCmd(c=>!c);}
      if((e.metaKey||e.ctrlKey)&&e.key==="/"){e.preventDefault();setCollapsed(c=>!c);}
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);

  const showToast=(msg,type="b")=>{setToast({msg,type});setTimeout(()=>setToast(null),4000);};

  const nav=useCallback(mod=>{setActive(mod);setMobOpen(false);setNotifOpen(false);setUserOpen(false);},[]);

  const grouped=SECS.map(s=>({sec:s,items:MODS.filter(m=>m.sec===s)}));
  const bottomItems=MODS.filter(m=>!m.sec);
  const View=VIEWS[active]||Dashboard;
  const activeMod=MODS.find(m=>m.id===active);
  const nopad=["pos","messages","ai","crm","projects"].includes(active);

  const toastBg=toast?.type==="g"?"var(--g)":toast?.type==="am"?"var(--am)":"var(--a)";
  const toastColor=toast?.type==="am"?"#000":"white";

  return (
    <>
      <style dangerouslySetInnerHTML={{__html:CSS}}/>
      <div className="app">
        {/* Mobile overlay */}
        {mobOpen&&<div onClick={()=>setMobOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:199}}/>}

        {/* ── SIDEBAR ── */}
        <div className={`sb${collapsed?" col":""}${mobOpen?" mob":""}`}>
          <div className="lwrap" onClick={()=>setCollapsed(c=>!c)} title="Toggle sidebar (⌘/)">
            <div className="lmark">N</div>
            <span className="ltxt">NexaERP</span>
            <span className="lbadge">ENTERPRISE</span>
          </div>
          <div className="sscroll noscroll">
            {grouped.map(g=>(
              <div key={g.sec} className="ssection">
                <div className="ssec">{g.sec}</div>
                {g.items.map(m=>(
                  <div key={m.id} className={`sit${active===m.id?" act":""}`} onClick={()=>nav(m.id)} title={m.l}>
                    <span className="sico">{m.ico}</span>
                    <span className="slbl">{m.l}</span>
                    {m.badge&&<span className={`sbadge ${m.bc||""}`}>{m.badge}</span>}
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div className="sbot">
            {bottomItems.map(m=>(
              <div key={m.id} className={`sit${active===m.id?" act":""}`} onClick={()=>nav(m.id)} title={m.l}>
                <span className="sico">{m.ico}</span><span className="slbl">{m.l}</span>
              </div>
            ))}
            <div className="upill rel" onClick={()=>setUserOpen(o=>!o)}>
              <Av name={D.user.name} size="md"/>
              <div className="uinf"><div className="uname">{D.user.name}</div><div className="urole">{D.user.role}</div></div>
              <div className="odot"/>
              {userOpen&&(
                <div className="drop" style={{bottom:"calc(100% + 6px)",left:0,right:0}}>
                  <div style={{padding:"10px 12px",borderBottom:"1px solid var(--bd)"}}><div className="bold xs">{D.user.name}</div><div className="xs t3">{D.user.email}</div></div>
                  <div className="di" onClick={()=>nav("settings")}>👤 My Profile</div>
                  <div className="di" onClick={()=>nav("settings")}>⚙️ Preferences</div>
                  <div className="di" onClick={()=>nav("settings")}>🔒 Security</div>
                  <div className="di">❓ Help Center</div>
                  <div className="dsep"/>
                  <div className="di" style={{color:"var(--r)"}}>↪ Sign Out</div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* ── MAIN ── */}
        <div className="main">
          <div className="topbar">
            <div className="tbl">
              <button className="btn btg bico" id="mob-btn" style={{display:"none"}} onClick={()=>setMobOpen(o=>!o)}>☰</button>
              <div className="bc"><span className="t3">NexaERP</span><span className="bcsep t3">/</span><span className="bccur">{activeMod?.l}</span></div>
            </div>
            <div className="strig" onClick={()=>setCmd(true)}>
              <span style={{fontSize:14,color:"var(--t3)"}}>⌕</span>
              <span>Search everything…</span>
              <span className="kbd">⌘K</span>
            </div>
            <div className="tbr">
              {offline&&<span className="badge bam pulse">📡 Offline</span>}
              <div className="rel">
                <button className="btn btg bico" onClick={()=>setNotifOpen(o=>!o)} title="Notifications">🔔<div className="ndot"/></button>
                {notifOpen&&(
                  <div className="drop" style={{right:0,top:"calc(100% + 6px)",width:300}} onClick={()=>setNotifOpen(false)}>
                    <div className="f fj fa" style={{padding:"10px 14px",borderBottom:"1px solid var(--bd)"}}><span className="bold xs">Notifications</span><span className="badge br xs">3 new</span></div>
                    {D.acts.slice(0,5).map((a,i)=><div key={i} className="di" style={{flexDirection:"column",alignItems:"flex-start",gap:2}}><div style={{fontSize:12,fontWeight:600}}>{a.text}</div><div className="xs t3">{a.time}</div></div>)}
                    <div style={{padding:"8px 12px",borderTop:"1px solid var(--bd)"}}><button className="btn btg bsm w100" style={{justifyContent:"center"}}>View All</button></div>
                  </div>
                )}
              </div>
              <button className="btn btg bico" title="Dark Mode">🌙</button>
              <button className="btn btp bsm" onClick={()=>setCmd(true)}>⌘K</button>
            </div>
          </div>

          <div className={`content${nopad?" ci np":""}`}>
            <View nav={nav}/>
          </div>
        </div>

        {cmd&&<CmdPalette onClose={()=>setCmd(false)} onNav={nav}/>}

        {toast&&(
          <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:toastBg,color:toastColor,borderRadius:20,padding:"9px 20px",fontSize:12.5,fontWeight:700,zIndex:9999,boxShadow:"var(--shlg)",animation:"sUp .3s var(--ease)",whiteSpace:"nowrap"}}>
            {toast.msg}
          </div>
        )}

        <style>{`
          @media(max-width:780px){#mob-btn{display:flex !important}}
        `}</style>
      </div>
    </>
  );
}

    // ─── Mount the app ────────────────────────────────────────────────────────
    document.getElementById('loading').style.display = 'none';
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(NexaERP));
  </script>
</body>
</html>
