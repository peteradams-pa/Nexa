// ─── UTILITY: timeAgo ────────────────────────────────────────────────────────
function timeAgo(iso) {
  if(!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return "Just now";
  if(m<60) return `${m} min ago`;
  const h = Math.floor(m/60);
  if(h<24) return `${h} hr ago`;
  const d = Math.floor(h/24);
  return `${d}d ago`;
}

// PHASE 2: DATA LAYER — localStorage persistence engine
// ═══════════════════════════════════════════════════════════════════════════════

const STORAGE_KEY = 'nexaerp_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveState(state) {
  try {
    // Don't persist ui-only keys
    const { ui, ...persist } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persist));
  } catch(e) { console.warn('NexaERP: storage save failed', e); }
}

// PHASE 4: GLOBAL STATE — AppContext + reducer
// ═══════════════════════════════════════════════════════════════════════════════

const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

function appReducer(state, action) {
  let next;
  switch(action.type) {

    // ── AUTH ──────────────────────────────────────────────────────────────────
    case 'LOGIN':
      return { ...state, currentUser: action.user, isAuthenticated: true };
    case 'LOGOUT':
      return { ...state, isAuthenticated: false };

    // ── SETTINGS ──────────────────────────────────────────────────────────────
    case 'UPDATE_SETTINGS':
      return { ...state, settings: { ...state.settings, ...action.payload } };
    case 'UPDATE_COMPANY':
      return { ...state, company: { ...state.company, ...action.payload } };

    // ── CUSTOMERS ─────────────────────────────────────────────────────────────
    case 'ADD_CUSTOMER':
      return { ...state, customers: [...state.customers, action.payload] };
    case 'UPDATE_CUSTOMER':
      return { ...state, customers: state.customers.map(c => c.id === action.payload.id ? { ...c, ...action.payload } : c) };
    case 'DELETE_CUSTOMER':
      return { ...state, customers: state.customers.filter(c => c.id !== action.id) };

    // ── PRODUCTS ──────────────────────────────────────────────────────────────
    case 'ADD_PRODUCT':
      return { ...state, products: [...state.products, action.payload] };
    case 'UPDATE_PRODUCT':
      return { ...state, products: state.products.map(p => p.id === action.payload.id ? { ...p, ...action.payload } : p) };
    case 'DELETE_PRODUCT':
      return { ...state, products: state.products.filter(p => p.id !== action.id) };

    // ── INVOICES ──────────────────────────────────────────────────────────────
    case 'ADD_INVOICE': {
      const inv = action.payload;
      // auto-create journal entry
      const je = {
        id: `JE-${String(state.journals.length + 1).padStart(4,'0')}`,
        date: inv.date, desc: `Invoice ${inv.id} — ${inv.custName}`,
        dr: 'Accounts Receivable', cr: 'Revenue',
        amt: inv.subtotal, ref: inv.id, createdBy: state.currentUser.id
      };
      return {
        ...state,
        invoices: [inv, ...state.invoices],
        journals: [je, ...state.journals],
      };
    }
    case 'UPDATE_INVOICE':
      return { ...state, invoices: state.invoices.map(i => i.id === action.payload.id ? { ...i, ...action.payload } : i) };
    case 'MARK_INVOICE_PAID': {
      const updated = state.invoices.map(i => i.id === action.id ? { ...i, status: 'Paid', paidAt: now() } : i);
      // cash receipt journal entry
      const inv = state.invoices.find(i => i.id === action.id);
      const je = {
        id: `JE-${String(state.journals.length + 1).padStart(4,'0')}`,
        date: today(), desc: `Cash receipt — ${inv?.custName}`,
        dr: 'Cash', cr: 'Accounts Receivable',
        amt: inv?.total || 0, ref: action.id, createdBy: state.currentUser.id
      };
      const notif = { id: `n${Date.now()}`, type:'payment', text:`Invoice ${action.id} paid — ${inv?.custName}`, time: now(), read:false, link:'sales' };
      return { ...state, invoices: updated, journals: [je, ...state.journals], notifications: [notif, ...state.notifications] };
    }
    case 'DELETE_INVOICE':
      return { ...state, invoices: state.invoices.filter(i => i.id !== action.id) };

    // ── LEADS / CRM ───────────────────────────────────────────────────────────
    case 'ADD_LEAD': {
      const notif = { id:`n${Date.now()}`, type:'lead', text:`New lead: ${action.payload.company} — ${fmt(action.payload.val)}`, time:now(), read:false, link:'crm' };
      return { ...state, leads: [...state.leads, action.payload], notifications: [notif, ...state.notifications] };
    }
    case 'UPDATE_LEAD':
      return { ...state, leads: state.leads.map(l => l.id === action.payload.id ? { ...l, ...action.payload } : l) };
    case 'DELETE_LEAD':
      return { ...state, leads: state.leads.filter(l => l.id !== action.id) };
    case 'MOVE_LEAD':
      return { ...state, leads: state.leads.map(l => l.id === action.id ? { ...l, stage: action.stage, days: 0 } : l) };

    // ── EMPLOYEES ─────────────────────────────────────────────────────────────
    case 'ADD_EMPLOYEE': {
      const notif = { id:`n${Date.now()}`, type:'hr', text:`New employee added: ${action.payload.name}`, time:now(), read:false, link:'hr' };
      return { ...state, employees: [...state.employees, action.payload], notifications: [notif, ...state.notifications] };
    }
    case 'UPDATE_EMPLOYEE':
      return { ...state, employees: state.employees.map(e => e.id === action.payload.id ? { ...e, ...action.payload } : e) };
    case 'DELETE_EMPLOYEE':
      return { ...state, employees: state.employees.filter(e => e.id !== action.id) };

    // ── INVENTORY ─────────────────────────────────────────────────────────────
    case 'RECEIVE_STOCK': {
      const { itemId, qty, ref: ref2 } = action.payload;
      const move = { id:`mv${Date.now()}`, itemId, type:'in', qty, ref: ref2, date: today(), by: state.currentUser.id };
      let notifs = [...state.notifications];
      const updated = state.inventory.map(i => {
        if(i.id !== itemId) return i;
        const newQty = i.qty + qty;
        return { ...i, qty: newQty, lastReceived: today() };
      });
      return { ...state, inventory: updated, stockMovements: [...state.stockMovements, move] };
    }
    case 'ISSUE_STOCK': {
      const { itemId, qty: qtyOut } = action.payload;
      const move = { id:`mv${Date.now()}`, itemId, type:'out', qty: qtyOut, ref: action.payload.ref, date: today(), by: state.currentUser.id };
      let notifs = [...state.notifications];
      const updated = state.inventory.map(i => {
        if(i.id !== itemId) return i;
        const newQty = Math.max(0, i.qty - qtyOut);
        if(newQty <= i.minStock) {
          notifs.push({ id:`n${Date.now()}`, type:'stock', text:`Low stock: ${i.name} (${newQty} units)`, time:now(), read:false, link:'inventory' });
        }
        return { ...i, qty: newQty };
      });
      return { ...state, inventory: updated, stockMovements: [...state.stockMovements, move], notifications: notifs };
    }
    case 'UPDATE_INVENTORY':
      return { ...state, inventory: state.inventory.map(i => i.id === action.payload.id ? { ...i, ...action.payload } : i) };

    // ── PROJECTS ──────────────────────────────────────────────────────────────
    case 'ADD_PROJECT':
      return { ...state, projects: [...state.projects, action.payload] };
    case 'UPDATE_PROJECT':
      return { ...state, projects: state.projects.map(p => p.id === action.payload.id ? { ...p, ...action.payload } : p) };
    case 'ADD_TASK':
      return { ...state, tasks: [...state.tasks, action.payload] };
    case 'UPDATE_TASK': {
      const updatedTasks = state.tasks.map(t => t.id === action.payload.id ? { ...t, ...action.payload } : t);
      // Recalculate project progress
      const updatedProjects = state.projects.map(p => {
        const pTasks = updatedTasks.filter(t => t.projId === p.id);
        const done = pTasks.filter(t => t.status === 'Done').length;
        const prog = pTasks.length ? Math.round((done / pTasks.length) * 100) : p.prog;
        return { ...p, prog };
      });
      return { ...state, tasks: updatedTasks, projects: updatedProjects };
    }
    case 'DELETE_TASK':
      return { ...state, tasks: state.tasks.filter(t => t.id !== action.id) };

    // ── TICKETS ───────────────────────────────────────────────────────────────
    case 'ADD_TICKET': {
      const notif = { id:`n${Date.now()}`, type:'ticket', text:`New ticket: ${action.payload.subj}`, time:now(), read:false, link:'helpdesk' };
      return { ...state, tickets: [action.payload, ...state.tickets], notifications: [notif, ...state.notifications] };
    }
    case 'UPDATE_TICKET':
      return { ...state, tickets: state.tickets.map(t => t.id === action.payload.id ? { ...t, ...action.payload } : t) };
    case 'REPLY_TICKET':
      return { ...state, tickets: state.tickets.map(t => t.id === action.id ? { ...t, replies: [...(t.replies||[]), action.reply] } : t) };
    case 'RESOLVE_TICKET': {
      const notif = { id:`n${Date.now()}`, type:'ticket', text:`Ticket ${action.id} resolved`, time:now(), read:false, link:'helpdesk' };
      return {
        ...state,
        tickets: state.tickets.map(t => t.id === action.id ? { ...t, status:'Resolved', resolvedAt: now() } : t),
        notifications: [notif, ...state.notifications],
      };
    }

    // ── CALENDAR ──────────────────────────────────────────────────────────────
    case 'ADD_EVENT':
      return { ...state, calendarEvents: [...state.calendarEvents, action.payload] };
    case 'UPDATE_EVENT':
      return { ...state, calendarEvents: state.calendarEvents.map(e => e.id === action.payload.id ? { ...e, ...action.payload } : e) };
    case 'DELETE_EVENT':
      return { ...state, calendarEvents: state.calendarEvents.filter(e => e.id !== action.id) };

    // ── MESSAGES ──────────────────────────────────────────────────────────────
    case 'SEND_MESSAGE': {
      const { channelId, message } = action;
      return {
        ...state,
        chatMessages: {
          ...state.chatMessages,
          [channelId]: [...(state.chatMessages[channelId] || []), message],
        },
      };
    }

    // ── JOURNALS ──────────────────────────────────────────────────────────────
    case 'ADD_JOURNAL':
      return { ...state, journals: [action.payload, ...state.journals] };

    // ── POS ORDERS ────────────────────────────────────────────────────────────
    case 'ADD_POS_ORDER': {
      const order = action.payload;
      // Deduct stock for physical products
      let updatedInv = [...state.inventory];
      let notifs = [...state.notifications];
      order.items.forEach(item => {
        updatedInv = updatedInv.map(inv => {
          if(inv.prodId !== item.id) return inv;
          const newQty = Math.max(0, inv.qty - item.qty);
          if(newQty <= inv.minStock) {
            notifs.push({ id:`n${Date.now()}${Math.random()}`, type:'stock', text:`Low stock: ${inv.name} (${newQty} units)`, time:now(), read:false, link:'inventory' });
          }
          return { ...inv, qty: newQty };
        });
      });
      const je = {
        id: `JE-${String(state.journals.length + 1).padStart(4,'0')}`,
        date: today(), desc: `POS Sale — ${order.id}`,
        dr: 'Cash', cr: 'Revenue', amt: order.total, ref: order.id, createdBy: state.currentUser.id
      };
      return {
        ...state,
        posOrders: [order, ...state.posOrders],
        inventory: updatedInv,
        journals: [je, ...state.journals],
        notifications: notifs,
      };
    }

    // ── NOTIFICATIONS ─────────────────────────────────────────────────────────
    case 'MARK_NOTIF_READ':
      return { ...state, notifications: state.notifications.map(n => n.id === action.id ? { ...n, read:true } : n) };
    case 'MARK_ALL_READ':
      return { ...state, notifications: state.notifications.map(n => ({ ...n, read:true })) };
    case 'ADD_NOTIFICATION':
      return { ...state, notifications: [action.payload, ...state.notifications] };

    // ── WORKFLOWS ─────────────────────────────────────────────────────────────
    case 'TOGGLE_WORKFLOW':
      return { ...state, workflows: state.workflows.map(w => w.id === action.id ? { ...w, status: w.status === 'Active' ? 'Paused' : 'Active' } : w) };
    case 'ADD_WORKFLOW':
      return { ...state, workflows: [...state.workflows, action.payload] };

    // ── CAMPAIGNS ─────────────────────────────────────────────────────────────
    case 'ADD_CAMPAIGN':
      return { ...state, campaigns: [...state.campaigns, action.payload] };
    case 'UPDATE_CAMPAIGN':
      return { ...state, campaigns: state.campaigns.map(c => c.id === action.payload.id ? { ...c, ...action.payload } : c) };

    // ── DOCUMENTS ─────────────────────────────────────────────────────────────
    case 'ADD_DOC':
      return { ...state, docs: [action.payload, ...state.docs] };
    case 'DELETE_DOC':
      return { ...state, docs: state.docs.filter(d => d.id !== action.id) };

    // ── AUDIT LOG ─────────────────────────────────────────────────────────────
    case 'LOG_ACTION':
      return { ...state, auditLog: [{ ...action.entry, id:`al${Date.now()}`, time:now() }, ...state.auditLog.slice(0,499)] };

    default:
      return state;
  }
}

function buildInitialState() {
  const saved = loadState();
  if(saved) {
    // Merge with SEED to catch any new fields added
    return {
      ...SEED,
      ...saved,
      isAuthenticated: false, // always start unauthenticated
    };
  }
  return { ...SEED, isAuthenticated: false };
}

// ── Computed selectors ───────────────────────────────────────────────────────
function useSelectors() {
  const { state } = useApp();

  return useMemo(() => {
    const invoices = state.invoices || [];
    const leads = state.leads || [];
    const employees = state.employees || [];
    const inventory = state.inventory || [];
    const posOrders = state.posOrders || [];

    const totalRevenue = invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+i.total,0);
    const outstanding = invoices.filter(i=>i.status==='Pending').reduce((s,i)=>s+i.total,0);
    const overdue = invoices.filter(i=>i.status==='Overdue').reduce((s,i)=>s+i.total,0);
    const totalOrders = invoices.length + posOrders.length;
    const uniqueCustomers = new Set(invoices.map(i=>i.custId)).size;
    const totalExpenses = (state.journals||[]).filter(j=>j.dr==='Expenses'||j.dr==='Payroll Expense').reduce((s,j)=>s+j.amt,0);

    const pipelineValue = leads.filter(l=>l.stage!=='Won'&&l.stage!=='Lost').reduce((s,l)=>s+l.val,0);
    const wonValue = leads.filter(l=>l.stage==='Won').reduce((s,l)=>s+l.val,0);
    const winRate = leads.length ? Math.round((leads.filter(l=>l.stage==='Won').length/leads.length)*100) : 0;

    const payrollGross = employees.reduce((s,e)=>s+e.sal,0);
    const payrollNHIF = employees.reduce((s,e)=>s+Math.round(e.sal*0.028),0);
    const payrollNSSF = employees.reduce((s,e)=>s+Math.min(2160,Math.round(e.sal*0.06)),0);
    const payrollPAYE = employees.reduce((s,e)=>{
      const tax = e.sal > 57667 ? (e.sal-57667)*0.3+16901 : e.sal > 32667 ? (e.sal-32667)*0.25+4276 : e.sal > 24000 ? (e.sal-24000)*0.2+667 : e.sal > 12000 ? (e.sal-12000)*0.15+0 : 0;
      return s + Math.max(0, Math.round(tax));
    }, 0);
    const payrollNet = payrollGross - payrollNHIF - payrollNSSF - payrollPAYE;

    const stockValue = inventory.reduce((s,i)=>s+(i.qty*i.cost),0);
    const lowStockItems = inventory.filter(i=>i.qty<=i.minStock);

    const unreadNotifs = (state.notifications||[]).filter(n=>!n.read).length;

    return {
      totalRevenue, outstanding, overdue, totalOrders, uniqueCustomers, totalExpenses,
      pipelineValue, wonValue, winRate,
      payrollGross, payrollNHIF, payrollNSSF, payrollPAYE, payrollNet,
      stockValue, lowStockItems,
      unreadNotifs,
    };
  }, [state]);
}

const AV_COLS = ["#6c6cff","#9b5cf6","#06b6d4","#22c55e","#ec4899","#f97316","#f59e0b","#ef4444"];
const avc = n => AV_COLS[(n?.charCodeAt(0)||0) % AV_COLS.length];

function Av({ name="?", size="md" }) {

function Bdg({ s }) {
  const m = {
    Paid:"bg",Active:"bg",Done:"bg",Resolved:"bg",Won:"bg",Online:"bg",Closed:"bg",Completed:"bg",Approved:"bg",Sent:"bg",
    Pending:"bam","In Progress":"bb",Planning:"bc2","On Leave":"bam",Scheduled:"bc2",Draft:"bgr",Processing:"bb",
    Overdue:"br",High:"br",Open:"bam",Urgent:"br",Critical:"br",Blocked:"br",

function Prog({ v=0, color, sm }) {
  return (
    <div className={`prog${sm?" sm":""}`}>
      <div className="progb" style={{width:`${Math.max(0,Math.min(100,v))}%`,background:color?`linear-gradient(to right,${color}99,${color})`:undefined}}/>
    </div>
  );
}

function Spark({ data=[], color="#6c6cff", w=80, h=32 }) {
  if (!data.length) return null;
  const mx=Math.max(...data), mn=Math.min(...data), rng=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*(h-5)-2}`).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <defs><linearGradient id={`sg${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity=".25"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#sg${color.replace("#","")})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function BarChart({ data=[], labels=[], h=130 }) {
  const mx=Math.max(...data,1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:5,height:h+18,paddingTop:10}}>
      {data.map((v,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <div style={{width:"100%",borderRadius:"4px 4px 0 0",height:`${Math.max(3,(v/mx)*h)}px`,
            background:`linear-gradient(to top,#6c6cff${i===data.length-1?"ff":"88"},#9b5cf6${i===data.length-1?"ff":"66"})`,
            transition:"height .5s var(--ease)"}}/>
          <span style={{fontSize:9,color:"var(--t3)"}}>{labels[i]}</span>
        </div>
      ))}
    </div>
  );
}

function Donut({ segs=[], size=110 }) {
  const tot=segs.reduce((s,g)=>s+g.v,0)||1;
  let cum=0;
  const r=size/2-14, cx=size/2, cy=size/2, sw=18;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segs.map((seg,i)=>{
        const pct=seg.v/tot, a0=cum*Math.PI*2-Math.PI/2;
        cum+=pct;
        const a1=cum*Math.PI*2-Math.PI/2, laf=pct>.5?1:0;
        const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
        return <path key={i} d={`M${x0} ${y0}A${r} ${r} 0 ${laf} 1 ${x1} ${y1}`} fill="none" stroke={seg.c} strokeWidth={sw} strokeLinecap="round"/>;
      })}
      <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle"
        style={{fontSize:12,fontWeight:800,fill:"var(--t)",fontFamily:"var(--font)"}}>
        {tot.toLocaleString()}
      </text>
    </svg>
  );
}

// ── Modal wrapper ─────────────────────────────────────────────────────────────
function Modal({ title, onClose, children, footer, size="" }) {
  useEffect(() => {
    const h = e => { if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h);
    return () => window.removeEventListener("keydown",h);
  },[onClose]);
  return (
    <div className="ov" onClick={onClose}>
      <div className={`modal ${size}`} onClick={e=>e.stopPropagation()}>
        <div className="mh">
          <span className="mt">{title}</span>
          <button className="btn btg bicos" onClick={onClose}>✕</button>
        </div>
        <div className="mb2">{children}</div>
        {footer && <div className="mf">{footer}</div>}
      </div>
    </div>
  );
}

// ── Toast system ──────────────────────────────────────────────────────────────
function Toast({ msg, type="b", onDone }) {
  useEffect(() => { const t=setTimeout(onDone,3800); return ()=>clearTimeout(t); },[onDone]);
  const bg = type==="g"?"var(--g)":type==="r"?"var(--r)":type==="am"?"var(--am)":"var(--a)";
  return (
    <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:bg,color:type==="am"?"#000":"white",borderRadius:20,padding:"9px 20px",fontSize:12.5,fontWeight:700,zIndex:9999,boxShadow:"var(--shlg)",animation:"sUp .3s var(--ease)",whiteSpace:"nowrap",pointerEvents:"none"}}>
      {msg}
    </div>
  );
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type="b") => setToast({msg,type}), []);
  const el = toast ? <Toast key={toast.msg+Date.now()} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/> : null;
  return [show, el];
}

// PHASE 4: LOGIN SCREEN
// ═══════════════════════════════════════════════════════════════════════════════
function LoginScreen() {
  const { actions } = useApp();
  const [email, setEmail] = useState("alex@nexacorp.ke");
  const [pass, setPass] = useState("password");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  // Demo credentials
  const CREDS = {
    "alex@nexacorp.ke":   { id:"usr_AM", name:"Alex Morgan",   role:"Super Admin" },
    "joy@nexacorp.ke":    { id:"usr_JW", name:"Joy Wanjiru",   role:"Sales Manager" },
    "peter@nexacorp.ke":  { id:"usr_PK", name:"Peter Kamau",   role:"Tech Lead" },
    "amina@nexacorp.ke":  { id:"usr_AH", name:"Amina Hassan",  role:"CFO" },
    "grace@nexacorp.ke":  { id:"usr_GM", name:"Grace Muthoni", role:"Accountant" },
  };

  const handleLogin = async (e) => {
    e && e.preventDefault();
    if (!email.trim()) { setErr("Email is required"); return; }
    if (!pass.trim())  { setErr("Password is required"); return; }
    setErr(""); setLoading(true);
    await new Promise(r => setTimeout(r, 700));
    const user = CREDS[email.toLowerCase()];
    if (user && pass === "password") {
      actions.login({ ...user, email });
    } else {
      setErr("Invalid credentials. Use password: password");
    }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div style={{width:"100%",maxWidth:400}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:56,height:56,borderRadius:16,background:"linear-gradient(135deg,var(--a),var(--a2))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:900,color:"white",margin:"0 auto 14px",boxShadow:"0 0 30px rgba(108,108,255,.45)"}}>N</div>
          <div style={{fontSize:22,fontWeight:900,letterSpacing:"-.5px"}}>Welcome to NexaERP</div>
          <div className="xs t3" style={{marginTop:4}}>Enterprise Business Platform</div>
        </div>
        {/* Form */}
        <div className="card" style={{padding:28}}>
          <form onSubmit={handleLogin}>
            <div className="field">
              <label className="flbl">Email Address</label>
              <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.ke" autoFocus/>
            </div>
            <div className="field">
              <label className="flbl">Password</label>
              <input className="inp" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"/>
            </div>
            {err && <div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,padding:"8px 12px",fontSize:12,color:"var(--r)",marginBottom:12}}>{err}</div>}
            <button type="submit" className="btn btp w100" style={{justifyContent:"center",padding:11,marginTop:4}} disabled={loading}>
              {loading ? "Signing in…" : "Sign In →"}
            </button>
          </form>
          <div className="div"/>
          <div className="xs t3" style={{textAlign:"center",marginBottom:8}}>Demo accounts (password: <span className="mono" style={{color:"var(--a)"}}>password</span>)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
            {Object.entries(CREDS).map(([em,u])=>(
              <button key={em} className="btn btg bxs" onClick={()=>{setEmail(em);setPass("password");}}>{u.role}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// DASHBOARD — live computed data
// ═══════════════════════════════════════════════════════════════════════════════
function Dashboard({ nav }) {
  const { state } = useApp();
  const sel = useSelectors();
  const [show, toastEl] = useToast();

  // Build monthly revenue from paid invoices + POS orders
  const monthlyRev = useMemo(() => {
    const buckets = Array(12).fill(0);
    (state.invoices||[]).filter(i=>i.status==='Paid'&&i.paidAt).forEach(i=>{
      const m = new Date(i.paidAt).getMonth();
      buckets[m] += i.total;
    });
    (state.posOrders||[]).forEach(o=>{
      const m = new Date(o.createdAt).getMonth();
      buckets[m] += o.total;
    });
    return buckets;
  },[state.invoices,state.posOrders]);

  const maxRev = Math.max(...monthlyRev,1);
  const mosSh = ["J","F","M","A","M","J","J","A","S","O","N","D"];

  const recentActs = useMemo(()=>{
    const notifs = (state.notifications||[]).slice(0,8);
    const iconMap = {payment:"💰",lead:"🎯",hr:"👤",stock:"📦",ticket:"🎫",system:"⚙️"};
    return notifs.map(n=>({icon:iconMap[n.type]||"🔔",text:n.text,time:timeAgo(n.time)}));
  },[state.notifications]);

  const stats = [
    { l:"Revenue (MTD)", v:fmt(sel.totalRevenue), chg:"+18.4%", up:true,  ico:"💰", c:"#6c6cff", mod:"sales" },
    { l:"Total Invoices", v:fmtN(state.invoices?.length||0), chg:"+12.1%", up:true,  ico:"📦", c:"#06b6d4", mod:"sales" },
    { l:"Active Customers",v:fmtN(state.customers?.length||0), chg:"+5.7%", up:true,  ico:"👥", c:"#22c55e", mod:"crm" },
    { l:"Expenses (MTD)", v:fmt(sel.totalExpenses), chg:"-3.2%", up:false, ico:"📉", c:"#f59e0b", mod:"accounting" },
  ];

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div>
          <h1 className="ptitle">Good morning, {(state.currentUser?.name||"").split(" ")[0]} 👋</h1>
          <p className="psub">{new Date().toLocaleDateString('en-KE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})} · {state.company?.name} · All systems operational</p>
        </div>
        <div className="f fa gap2">
          <button className="btn btg bsm" onClick={()=>{show("Report exported as PDF","g");}}>📤 Export</button>
          <button className="btn btp bsm" onClick={()=>nav("sales")}>+ New Invoice</button>
        </div>
      </div>

      <div className="g g4 gap4 mb5">
        {stats.map(s=>(
          <div key={s.l} className="stat cur" onClick={()=>nav(s.mod)}>
            <div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div>
            <div className="slb">{s.l}</div>
            <div className="sv">{s.v}</div>
            <div className={`sc ${s.up?"up":"dn"}`}>{s.up?"↑":"↓"} {s.chg} vs last month
              <Spark data={monthlyRev.slice(0,new Date().getMonth()+1).slice(-6)} color={s.c}/>
            </div>
          </div>
        ))}
      </div>

      <div className="g gap4 mb4" style={{gridTemplateColumns:"1fr 310px"}}>
        <div className="card cp">
          <div className="f fj fa mb4">
            <div><div className="ct">Revenue Overview</div><div className="csub">Monthly · {new Date().getFullYear()}</div></div>
            <div className="f fa gap3">
              <div className="f fa gap1"><div className="dot dotb"/><span className="xs t2">Revenue</span></div>
            </div>
          </div>
          <BarChart data={monthlyRev} labels={mosSh} h={140}/>
          <div className="f gap4 mt3">
            {[{l:"Total",v:fmt(sel.totalRevenue),c:"var(--a)"},{l:"Outstanding",v:fmt(sel.outstanding),c:"var(--am)"},{l:"Overdue",v:fmt(sel.overdue),c:"var(--r)"}].map(m=>(
              <div key={m.l}><div className="xs t3 upper mb1">{m.l}</div><div className="bold mono" style={{color:m.c}}>{m.v}</div></div>
            ))}
          </div>
        </div>
        <div className="card cp">
          <div className="f fj fa mb3"><div className="ct">Live Activity</div><span className="badge bg pulse">● Live</span></div>
          <div className="fc gap1">
            {recentActs.length===0 && <div className="xs t3">No recent activity</div>}
            {recentActs.map((a,i)=>(
              <div key={i} className="f fa gap2" style={{padding:"7px 0",borderBottom:i<recentActs.length-1?"1px solid var(--bd)":"none"}}>
                <div style={{width:28,height:28,borderRadius:8,background:"var(--bg3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{a.icon}</div>
                <div style={{flex:1,minWidth:0}}><div className="trunc" style={{fontSize:11.5,fontWeight:500,lineHeight:1.4}}>{a.text}</div><div className="xs t3">{a.time}</div></div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="g gap4" style={{gridTemplateColumns:"1fr 1fr 280px"}}>
        <div className="card" style={{padding:0}}>
          <div className="f fj fa" style={{padding:"14px 18px 0"}}><div className="ct">Recent Invoices</div><button className="btn btg bsm" onClick={()=>nav("sales")}>View All →</button></div>
          <div className="tw" style={{marginTop:10}}>
            <table>
              <thead><tr><th>Invoice</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
              <tbody>
                {(state.invoices||[]).slice(0,5).map(inv=>(
                  <tr key={inv.id} className="cur" onClick={()=>nav("sales")}>
                    <td className="mono ta" style={{fontSize:11,color:"var(--a)"}}>{inv.id}</td>
                    <td>{inv.custName}</td>
                    <td className="mono" style={{fontSize:12}}>{fmt(inv.total)}</td>
                    <td><Bdg s={inv.status}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="card cp">
          <div className="ct mb4">Pipeline Health</div>
          {[
            {l:"Qualified Leads", v: (state.leads||[]).filter(l=>l.stage==="Qualified").length*10+40, c:"#6c6cff"},
            {l:"Active Proposals",v: (state.leads||[]).filter(l=>l.stage==="Proposal").length*15+30,  c:"#f59e0b"},
            {l:"Win Rate",        v: sel.winRate,                                                     c:"#22c55e"},
            {l:"Pipeline Value",  v: Math.min(99,Math.round((sel.pipelineValue/10000000)*100)),        c:"#06b6d4"},
          ].map(p=>(
            <div key={p.l} className="mb3">
              <div className="f fj" style={{marginBottom:4}}><span className="sm t2">{p.l}</span><span className="sm bold">{p.l==="Win Rate"||p.l==="Active Proposals"||p.l==="Qualified Leads"?`${p.v}%`:fmt(sel.pipelineValue)}</span></div>
              <Prog v={p.v} color={p.c}/>
            </div>
          ))}
          <div className="div"/>
          <div className="f fj fa">
            <div className="fc gap1"><span className="xs t3">Pipeline Total</span><span className="bold mono ta">{fmt(sel.pipelineValue)}</span></div>
            <button className="btn btg bsm" onClick={()=>nav("crm")}>CRM →</button>
          </div>
        </div>
        <div className="card cp">
          <div className="ct mb3">Quick Access</div>
          <div className="fc gap1">
            {[
              {mod:"crm",ico:"🎯",l:"CRM Pipeline",     sub:`${(state.leads||[]).filter(l=>!['Won','Lost'].includes(l.stage)).length} open opportunities`},
              {mod:"helpdesk",ico:"🎫",l:"Helpdesk",     sub:`${(state.tickets||[]).filter(t=>t.status!=='Resolved').length} unresolved tickets`, alert:(state.tickets||[]).filter(t=>t.prio==='High'&&t.status!=='Resolved').length>0},
              {mod:"projects",ico:"📋",l:"Projects",     sub:`${(state.projects||[]).filter(p=>p.status==='In Progress').length} active`},
              {mod:"inventory",ico:"📦",l:"Inventory",   sub:`${sel.lowStockItems.length} low-stock alerts`, alert:sel.lowStockItems.length>0},
              {mod:"hr",ico:"👥",l:"HR",                sub:`${(state.employees||[]).filter(e=>e.status==='On Leave').length} on leave`},
              {mod:"ai",ico:"🤖",l:"AI Assistant",      sub:"Ask anything..."},
            ].map(m=>(
              <div key={m.mod} className="f fa gap2 cur" onClick={()=>nav(m.mod)} style={{padding:8,borderRadius:8,transition:"background .12s"}} onMouseEnter={e=>e.currentTarget.style.background="var(--sf)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                <span style={{fontSize:16}}>{m.ico}</span>
                <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:700}}>{m.l}</div><div className="xs t3">{m.sub}</div></div>
                {m.alert&&<span className="dot dotr"/>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// CRM — full CRUD, live pipeline
// ═══════════════════════════════════════════════════════════════════════════════
function CRM() {
  const { state, actions } = useApp();
  const [view, setView] = useState("kanban");
  const [showM, setShowM] = useState(false);
  const [editLead, setEditLead] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [show, toastEl] = useToast();

  const STAGES = ["New","Qualified","Proposal","Negotiation","Won","Lost"];
  const STAGE_COLORS = {New:"#5a5a88",Qualified:"#6c6cff",Proposal:"#f59e0b",Negotiation:"#06b6d4",Won:"#22c55e",Lost:"#ef4444"};

  const leads = state.leads || [];
  const employees = state.employees || [];

  const grouped = useMemo(()=>
    STAGES.map(stage=>({stage, color:STAGE_COLORS[stage], items:leads.filter(l=>l.stage===stage)})),
  [leads]);

  const pipelineVal = leads.filter(l=>!["Won","Lost"].includes(l.stage)).reduce((s,l)=>s+l.val,0);

  // New/Edit Lead Form
  const emptyForm = {company:"",contact:"",email:"",phone:"",val:0,stage:"New",tag:"",prio:"medium",own:"usr_AM",ownName:"Alex Morgan",notes:""};
  const [form, setForm] = useState(emptyForm);
  const setF = (k,v) => setForm(prev=>({...prev,[k]:v}));

  const openNew = () => { setForm(emptyForm); setEditLead(null); setShowM(true); };
  const openEdit = (lead) => { setForm({...lead}); setEditLead(lead.id); setShowM(true); };

  const saveLead = () => {
    if(!form.company.trim()){show("Company name is required","r");return;}
    const emp = employees.find(e=>e.id===form.own);
    const payload = {...form, val:parseFloat(form.val)||0, ownName:emp?.name||form.ownName, days:0, prob: form.stage==="Won"?100:form.stage==="Negotiation"?75:form.stage==="Proposal"?45:form.stage==="Qualified"?55:20, createdAt:now()};
    if(editLead){
      actions.updateLead({...payload, id:editLead});
      show("Lead updated","g");
    } else {
      actions.addLead({...payload, id:`lead_${uid()}`});
      show("Lead created","g");
    }
    setShowM(false);
  };

  const deleteLead = (id) => {
    setConfirm({msg:"Delete this lead permanently?", onYes:()=>{ actions.deleteLead(id); show("Lead deleted"); setConfirm(null); }});
  };

  const moveLead = (id, newStage) => {
    actions.moveLead(id, newStage);
    show(`Moved to ${newStage}`,"g");
  };

  const sel = useSelectors();

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {toastEl}{confirm&&<Confirm msg={confirm.msg} onYes={confirm.onYes} onNo={()=>setConfirm(null)}/>}
      <div className="ci" style={{paddingBottom:0,flexShrink:0}}>
        <div className="ph" style={{marginBottom:12}}>
          <div><h1 className="ptitle">CRM Pipeline</h1><p className="psub">{leads.filter(l=>!['Won','Lost'].includes(l.stage)).length} active · {fmt(pipelineVal)} · {sel.winRate}% win rate</p></div>
          <div className="f fa gap2">
            <div className="tabs">{["kanban","list","forecast"].map(v=><div key={v} className={`tab ${view===v?"act":""}`} onClick={()=>setView(v)}>{v.charAt(0).toUpperCase()+v.slice(1)}</div>)}</div>
            <button className="btn btp bsm" onClick={openNew}>+ New Lead</button>
          </div>
        </div>
        {view==="forecast"&&(
          <div className="g g3 gap4 mb4">
            {["Qualified","Proposal","Negotiation"].map(stage=>{
              const items=leads.filter(l=>l.stage===stage);
              const val=items.reduce((s,l)=>s+l.val,0);
              const prob=stage==="Negotiation"?75:stage==="Proposal"?45:55;
              return <div key={stage} className="stat"><div className="slb">{stage}</div><div className="sv" style={{fontSize:20}}>{fmt(val)}</div><div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>{items.length} deals · {prob}% avg probability</div><div className="mt2"><Prog v={prob}/></div></div>;
            })}
          </div>
        )}
      </div>

      {view==="kanban"&&(
        <div style={{flex:1,overflow:"hidden",padding:"0 24px 12px"}}>
          <div className="kan noscroll">
            {grouped.map(col=>(
              <div key={col.stage} className="kcol">
                <div className="kch">
                  <div className="f fa gap2"><div className="dot" style={{background:col.color}}/><span className="kct">{col.stage}</span><span className="kcnt">{col.items.length}</span></div>
                  <span className="xs t3 mono">{fmt(col.items.reduce((s,i)=>s+i.val,0))}</span>
                </div>
                <div className="kcards noscroll">
                  {col.items.map(item=>(
                    <div key={item.id} className="kcard">
                      <div className="f fj fa mb1">
                        <div className="kctitle" style={{marginBottom:0}}>{item.company}</div>
                        <button className="btn btg bxs" onClick={()=>openEdit(item)}>✏️</button>
                      </div>
                      <div className="xs t3 mb2">{item.contact}</div>
                      <div className="f fa gap2 mb1"><span className="badge bgr xs">{item.tag}</span><span className={`badge xs ${item.prio==="high"?"br":item.prio==="medium"?"bam":"bgr"}`}>{item.prio}</span></div>
                      <div className="kcft">
                        <span className="bold mono" style={{fontSize:13,color:"var(--t)"}}>{fmt(item.val)}</span>
                        <div className="f fa gap1"><Av name={item.ownName} size="sm"/><span className="xs t3">{item.days}d</span></div>
                      </div>
                      <div className="f fa gap1 mt2" style={{flexWrap:"wrap"}}>
                        {STAGES.filter(s=>s!==col.stage).slice(0,3).map(s=>(
                          <button key={s} className="btn btg bxs" style={{fontSize:9}} onClick={()=>moveLead(item.id,s)}>→{s}</button>
                        ))}
                        <button className="btn btd bxs" style={{fontSize:9}} onClick={()=>deleteLead(item.id)}>🗑</button>
                      </div>
                    </div>
                  ))}
                  <div className="kadd" onClick={openNew}>+ Add card</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {view==="list"&&(
        <div className="ci" style={{paddingTop:0,flex:1,overflowY:"auto"}}>
          <div className="tw bd">
            <table>
              <thead><tr><th>Company</th><th>Contact</th><th>Value</th><th>Stage</th><th>Priority</th><th>Owner</th><th>Days</th><th>Actions</th></tr></thead>
              <tbody>
                {leads.map(l=>(
                  <tr key={l.id}>
                    <td>{l.company}</td><td className="t2 xs">{l.contact}</td>
                    <td className="mono xs">{fmt(l.val)}</td>
                    <td><div className="f fa gap1"><div className="dot" style={{background:STAGE_COLORS[l.stage]}}/><span>{l.stage}</span></div></td>
                    <td><Bdg s={l.prio==="high"?"High":l.prio==="medium"?"Medium":"Low"}/></td>
                    <td><div className="f fa gap1"><Av name={l.ownName} size="sm"/><span className="xs t2">{l.ownName}</span></div></td>
                    <td className="xs t3">{l.days}d</td>
                    <td><div className="f fa gap1">
                      <button className="btn btg bxs" onClick={()=>openEdit(l)}>Edit</button>
                      <button className="btn btd bxs" onClick={()=>deleteLead(l.id)}>Del</button>
                    </div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {showM&&(
        <Modal title={editLead?"Edit Lead":"New Lead"} onClose={()=>setShowM(false)} size="mlg"
          footer={<><button className="btn btg" onClick={()=>setShowM(false)}>Cancel</button><button className="btn btp" onClick={saveLead}>{editLead?"Save Changes":"Create Lead"}</button></>}>
          <div className="g g2 gap3">
            <div className="field"><label className="flbl">Company Name *</label><input className="inp" value={form.company} onChange={e=>setF("company",e.target.value)} placeholder="e.g. Safaricom PLC"/></div>
            <div className="field"><label className="flbl">Deal Value (KES)</label><input className="inp" type="number" value={form.val} onChange={e=>setF("val",e.target.value)} placeholder="0"/></div>
            <div className="field"><label className="flbl">Contact Name</label><input className="inp" value={form.contact} onChange={e=>setF("contact",e.target.value)} placeholder="Full name"/></div>
            <div className="field"><label className="flbl">Email</label><input className="inp" type="email" value={form.email} onChange={e=>setF("email",e.target.value)} placeholder="contact@company.com"/></div>
            <div className="field"><label className="flbl">Phone</label><input className="inp" value={form.phone} onChange={e=>setF("phone",e.target.value)} placeholder="+254 7xx xxx xxx"/></div>
            <div className="field"><label className="flbl">Industry Tag</label><input className="inp" value={form.tag} onChange={e=>setF("tag",e.target.value)} placeholder="e.g. Finance, Tech, Health"/></div>
            <div className="field"><label className="flbl">Stage</label>
              <select className="inp" value={form.stage} onChange={e=>setF("stage",e.target.value)}>
                {STAGES.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Priority</label>
              <select className="inp" value={form.prio} onChange={e=>setF("prio",e.target.value)}>
                <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
              </select>
            </div>
            <div className="field"><label className="flbl">Owner</label>
              <select className="inp" value={form.own} onChange={e=>{const emp=employees.find(x=>x.id===e.target.value);setF("own",e.target.value);setF("ownName",emp?.name||"");}}>
                {employees.map(e=><option key={e.id} value={e.id}>{e.name} — {e.role}</option>)}
              </select>
            </div>
            <div className="field" style={{gridColumn:"span 1"}}><label className="flbl">Notes</label><textarea className="inp" value={form.notes} onChange={e=>setF("notes",e.target.value)} placeholder="Add context, source, next steps..."/></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// SALES — full invoice CRUD
// ═══════════════════════════════════════════════════════════════════════════════
function Sales() {
  const { state, actions } = useApp();
  const [tab, setTab] = useState("invoices");
  const [showM, setShowM] = useState(false);
  const [search, setSearch] = useState("");
  const [confirm, setConfirm] = useState(null);
  const [show, toastEl] = useToast();
  const sel = useSelectors();

  const invoices = state.invoices || [];
  const customers = state.customers || [];
  const products = state.products || [];

  const filtered = useMemo(()=>
    invoices.filter(inv=>
      !search ||
      inv.custName.toLowerCase().includes(search.toLowerCase()) ||
      inv.id.toLowerCase().includes(search.toLowerCase())
    ),[invoices,search]);

  // Invoice form
  const emptyLine = () => ({id:uid(), prodId:"", name:"", qty:1, price:0, tax:16});
  const emptyForm = { custId:"", custName:"", date:today(), due:"", notes:"", lines:[emptyLine()] };
  const [form, setForm] = useState(emptyForm);
  const setF = (k,v)=>setForm(p=>({...p,[k]:v}));

  const updateLine = (idx,k,v)=>setForm(p=>({...p,lines:p.lines.map((l,i)=>i===idx?{...l,[k]:v}:l)}));
  const addLine = ()=>setForm(p=>({...p,lines:[...p.lines,emptyLine()]}));
  const removeLine = idx=>setForm(p=>({...p,lines:p.lines.filter((_,i)=>i!==idx)}));

  const lineSubtotal = (l) => (parseFloat(l.qty)||0)*(parseFloat(l.price)||0);
  const formSubtotal = form.lines.reduce((s,l)=>s+lineSubtotal(l),0);
  const formTax = form.lines.reduce((s,l)=>s+lineSubtotal(l)*(parseFloat(l.tax)||0)/100,0);
  const formTotal = formSubtotal + formTax;

  const genInvId = () => {
    const last = invoices[0]?.id || "INV-2400";
    const num = parseInt(last.replace("INV-",""))+1;
    return `INV-${num}`;
  };

  const saveInvoice = () => {
    if(!form.custId){show("Select a customer","r");return;}
    if(!form.due){show("Set a due date","r");return;}
    if(form.lines.some(l=>!l.name)){show("All line items need a name","r");return;}
    const payload = {
      id:genInvId(), custId:form.custId, custName:form.custName,
      lines:form.lines.map(l=>({...l,qty:parseFloat(l.qty)||1,price:parseFloat(l.price)||0})),
      status:"Draft", date:form.date, due:form.due, paidAt:null,
      subtotal:formSubtotal, tax:formTax, total:formTotal, notes:form.notes,
    };
    actions.addInvoice(payload);
    actions.log({module:"Sales",action:`Created invoice ${payload.id}`,user:state.currentUser?.name});
    show(`Invoice ${payload.id} created`,"g");
    setShowM(false);
    setForm(emptyForm);
  };

  const markPaid = (id)=>{
    actions.markInvoicePaid(id);
    actions.log({module:"Sales",action:`Marked ${id} as paid`,user:state.currentUser?.name});
    show("Invoice marked as paid ✓","g");
  };

  const deleteInv = (id)=>{
    setConfirm({msg:`Delete invoice ${id}? This cannot be undone.`,onYes:()=>{actions.deleteInvoice(id);show("Invoice deleted");setConfirm(null);}});
  };

  return (
    <div className="ci">
      {toastEl}{confirm&&<Confirm msg={confirm.msg} onYes={confirm.onYes} onNo={()=>setConfirm(null)}/>}
      <div className="ph">
        <div><h1 className="ptitle">Sales</h1><p className="psub">Invoices · Quotations · Revenue Management</p></div>
        <button className="btn btp" onClick={()=>{setForm(emptyForm);setShowM(true);}}>+ New Invoice</button>
      </div>
      <div className="g g4 gap4 mb5">
        {[
          {l:"Total Invoiced",v:fmt(invoices.reduce((s,i)=>s+i.total,0)),ico:"📄",c:"#6c6cff"},
          {l:"Collected",     v:fmt(sel.totalRevenue),ico:"✅",c:"#22c55e"},
          {l:"Outstanding",   v:fmt(sel.outstanding), ico:"⏳",c:"#f59e0b"},
          {l:"Overdue",       v:fmt(sel.overdue),     ico:"⚠️",c:"#ef4444"},
        ].map(s=>(
          <div key={s.l} className="stat"><div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div><div className="slb">{s.l}</div><div className="sv" style={{fontSize:20}}>{s.v}</div></div>
        ))}
      </div>
      <div className="card" style={{padding:0}}>
        <div className="f fj fa" style={{padding:"14px 18px",borderBottom:"1px solid var(--bd)",gap:12,flexWrap:"wrap"}}>
          <div className="tabs">{["invoices","quotes"].map(t=><div key={t} className={`tab ${tab===t?"act":""}`} onClick={()=>setTab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</div>)}</div>
          <input className="inp" style={{maxWidth:240,height:34}} placeholder="🔍 Search invoices…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        {tab==="invoices"&&(
          <div className="tw">
            <table>
              <thead><tr><th>Invoice #</th><th>Customer</th><th>Date</th><th>Due</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                {filtered.map(inv=>(
                  <tr key={inv.id}>
                    <td className="mono ta" style={{fontSize:11.5,color:"var(--a)"}}>{inv.id}</td>
                    <td>{inv.custName}</td>
                    <td className="t3 xs">{inv.date}</td>
                    <td className="t3 xs">{inv.due}</td>
                    <td className="mono bold" style={{fontSize:12.5}}>{fmt(inv.total)}</td>
                    <td><Bdg s={inv.status}/></td>
                    <td><div className="f fa gap1">
                      {inv.status!=="Paid"&&<button className="btn bts bxs" onClick={()=>markPaid(inv.id)}>✓ Paid</button>}
                      <button className="btn btg bxs" onClick={()=>deleteInv(inv.id)}>🗑</button>
                    </div></td>
                  </tr>
                ))}
                {filtered.length===0&&<tr><td colSpan={7} style={{textAlign:"center",padding:"24px",color:"var(--t3)"}}>No invoices found</td></tr>}
              </tbody>
            </table>
          </div>
        )}
        {tab==="quotes"&&<div className="empty"><div className="eico">📄</div><div className="etitle">Quotations</div><div className="esub">Create quotes by adding invoices with Draft status</div></div>}
      </div>

      {showM&&(
        <Modal title="New Invoice" onClose={()=>setShowM(false)} size="mlg"
          footer={<><button className="btn btg" onClick={()=>setShowM(false)}>Cancel</button><button className="btn btg" onClick={()=>{const p={...form};setForm(p);}}>Save Draft</button><button className="btn btp" onClick={saveInvoice}>Create Invoice</button></>}>
          <div className="g g2 gap3 mb4">
            <div className="field"><label className="flbl">Customer *</label>
              <select className="inp" value={form.custId} onChange={e=>{const c=customers.find(x=>x.id===e.target.value);setF("custId",e.target.value);setF("custName",c?.name||"");}}>
                <option value="">Select customer…</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Invoice Date</label><input className="inp" type="date" value={form.date} onChange={e=>setF("date",e.target.value)}/></div>
            <div className="field"><label className="flbl">Due Date *</label><input className="inp" type="date" value={form.due} onChange={e=>setF("due",e.target.value)}/></div>
            <div className="field"><label className="flbl">Notes</label><input className="inp" value={form.notes} onChange={e=>setF("notes",e.target.value)} placeholder="Optional notes…"/></div>
          </div>
          <div className="sectitle">Line Items</div>
          <div className="tw bd mb3">
            <table>
              <thead><tr><th>Product / Description</th><th>Qty</th><th>Unit Price (KES)</th><th>Tax %</th><th>Total</th><th></th></tr></thead>
              <tbody>
                {form.lines.map((l,idx)=>(
                  <tr key={l.id}>
                    <td>
                      <select className="inp" style={{height:32,fontSize:12}} value={l.prodId} onChange={e=>{
                        const p=products.find(x=>x.id===e.target.value);
                        updateLine(idx,"prodId",e.target.value);
                        if(p){updateLine(idx,"name",p.name);updateLine(idx,"price",p.price);updateLine(idx,"tax",p.taxRate);}
                      }}>
                        <option value="">Custom…</option>
                        {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      {!l.prodId&&<input className="inp" style={{height:32,marginTop:4,fontSize:12}} value={l.name} onChange={e=>updateLine(idx,"name",e.target.value)} placeholder="Description"/>}
                    </td>
                    <td><input className="inp" type="number" style={{height:32,width:60}} value={l.qty} onChange={e=>updateLine(idx,"qty",e.target.value)}/></td>
                    <td><input className="inp" type="number" style={{height:32}} value={l.price} onChange={e=>updateLine(idx,"price",e.target.value)}/></td>
                    <td><input className="inp" type="number" style={{height:32,width:60}} value={l.tax} onChange={e=>updateLine(idx,"tax",e.target.value)}/></td>
                    <td className="mono bold" style={{fontSize:12}}>{fmt(lineSubtotal(l))}</td>
                    <td><button className="btn btd bxs" onClick={()=>removeLine(idx)} disabled={form.lines.length===1}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button className="btn btg bsm mb4" onClick={addLine}>+ Add Line Item</button>
          <div className="f" style={{justifyContent:"flex-end"}}>
            <div style={{width:260}}>
              {[{l:"Subtotal",v:fmt(formSubtotal)},{l:"VAT / Tax",v:fmt(formTax)}].map(r=>(
                <div key={r.l} className="f fj" style={{padding:"5px 0",fontSize:12,color:"var(--t2)"}}><span>{r.l}</span><span className="mono">{r.v}</span></div>
              ))}
              <div className="div"/>
              <div className="f fj bold" style={{fontSize:15}}><span>Total</span><span className="mono">{fmt(formTotal)}</span></div>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ACCOUNTING — live journals, P&L computed
// ═══════════════════════════════════════════════════════════════════════════════
function Accounting() {
  const { state, actions } = useApp();
  const [tab, setTab] = useState("overview");
  const [showM, setShowM] = useState(false);
  const [show, toastEl] = useToast();
  const sel = useSelectors();

  const journals = state.journals || [];
  const invoices = state.invoices || [];

  const totalPaid   = invoices.filter(i=>i.status==="Paid").reduce((s,i)=>s+i.total,0);
  const totalAR     = invoices.filter(i=>["Pending","Overdue"].includes(i.status)).reduce((s,i)=>s+i.total,0);
  const totalAP     = 430000; // would come from bills module
  const cashBalance = 8700000; // would come from bank reconciliation

  const grossProfit   = totalPaid * 0.56;
  const operatingExp  = totalPaid * 0.22;
  const netProfit     = grossProfit - operatingExp;

  const emptyJE = { date:today(), desc:"", dr:"", cr:"", amt:0, ref:"" };
  const [jeForm, setJE] = useState(emptyJE);
  const setJ = (k,v) => setJE(p=>({...p,[k]:v}));

  const GL_ACCOUNTS = ["Cash","Bank Account","Accounts Receivable","Accounts Payable","Revenue","Cost of Goods","Expenses","Payroll Expense","Tax Payable","Retained Earnings","Acc. Depreciation","Depreciation Exp.","Prepaid Expenses","Fixed Assets","Loan Payable"];

  const saveJE = () => {
    if(!jeForm.desc||!jeForm.dr||!jeForm.cr||!jeForm.amt){show("All fields required","r");return;}
    if(jeForm.dr===jeForm.cr){show("Debit and credit accounts must differ","r");return;}
    const payload = {
      id:`JE-${String(journals.length+1).padStart(4,"0")}`,
      ...jeForm, amt:parseFloat(jeForm.amt)||0,
      createdBy: state.currentUser?.id||"usr_AM"
    };
    actions.addJournal(payload);
    actions.log({module:"Accounting",action:`Journal entry ${payload.id}`,user:state.currentUser?.name});
    show("Journal entry posted","g");
    setShowM(false);
    setJE(emptyJE);
  };

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div><h1 className="ptitle">Accounting</h1><p className="psub">Double-entry · Financial reporting · Tax management</p></div>
        <div className="f fa gap2"><button className="btn btg bsm">📊 Reports</button><button className="btn btp bsm" onClick={()=>setShowM(true)}>+ Journal Entry</button></div>
      </div>
      <div className="tabs mb4">{["overview","journal","reports"].map(t=><div key={t} className={`tab ${tab===t?"act":""}`} onClick={()=>setTab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</div>)}</div>

      {tab==="overview"&&(
        <>
          <div className="g g3 gap4 mb5">
            {[
              {l:"Cash & Bank",          v:fmt(cashBalance), ico:"🏦", sub:"+2 accounts", c:"#22c55e"},
              {l:"Accounts Receivable",  v:fmt(totalAR),     ico:"📥", sub:`${invoices.filter(i=>["Pending","Overdue"].includes(i.status)).length} open invoices`, c:"#6c6cff"},
              {l:"Accounts Payable",     v:fmt(totalAP),     ico:"📤", sub:"5 bills due",  c:"#f59e0b"},
            ].map(s=>(
              <div key={s.l} className="stat"><div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div><div className="slb">{s.l}</div><div className="sv" style={{fontSize:22}}>{s.v}</div><div className="xs t3 mt1">{s.sub}</div></div>
            ))}
          </div>
          <div className="g gap4" style={{gridTemplateColumns:"1fr 1fr"}}>
            <div className="card" style={{padding:0}}>
              <div className="ch mb3"><div className="ct">Recent Journal Entries</div></div>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th>Date</th><th>Ref</th><th>Description</th><th>Debit</th><th>Credit</th><th>Amount</th></tr></thead>
                <tbody>
                  {journals.slice(0,8).map(j=>(
                    <tr key={j.id}>
                      <td className="xs t3">{j.date}</td>
                      <td className="mono ta" style={{fontSize:11,color:"var(--a)"}}>{j.id}</td>
                      <td style={{maxWidth:140}} className="trunc xs">{j.desc}</td>
                      <td className="xs t2">{j.dr}</td>
                      <td className="xs t2">{j.cr}</td>
                      <td className="mono bold xs">{fmt(j.amt)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="fc gap4">
              <div className="card cp">
                <div className="ct mb4">P&L Summary — {new Date().toLocaleString('default',{month:'long',year:'numeric'})}</div>
                {[
                  {l:"Revenue",       v:totalPaid,    type:"credit"},
                  {l:"Cost of Goods", v:totalPaid*0.44,type:"debit"},
                  {l:"Gross Profit",  v:grossProfit,  type:"profit"},
                  {l:"Operating Exp.",v:operatingExp, type:"debit"},
                  {l:"Net Profit",    v:netProfit,    type:"profit"},
                ].map(r=>(
                  <div key={r.l} className="mrow">
                    <span className="sm t2">{r.l}</span>
                    <span className="mono bold" style={{fontSize:13,color:r.type==="profit"?"var(--g)":r.type==="debit"?"var(--r)":"var(--t)"}}>{r.type==="debit"?"− ":""}{fmt(r.v)}</span>
                  </div>
                ))}
              </div>
              <div className="card cp">
                <div className="ct mb3">Quick Actions</div>
                {["Bank Reconciliation","Tax Report","Balance Sheet","Cash Flow Statement","Audit Trail"].map(a=>(
                  <div key={a} className="mrow cur" onClick={()=>show(`Opening ${a}…`)} onMouseEnter={e=>e.currentTarget.style.color="var(--a)"} onMouseLeave={e=>e.currentTarget.style.color=""}><span style={{fontSize:12.5}}>{a}</span><span className="t3">→</span></div>
                ))}
              </div>
            </div>
          </div>
        </>
      )}

      {tab==="journal"&&(
        <div className="tw bd">
          <table>
            <thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Debit Account</th><th>Credit Account</th><th>Amount</th><th>Posted By</th></tr></thead>
            <tbody>
              {journals.map(j=>{
                const poster=state.employees?.find(e=>e.id===j.createdBy);
                return <tr key={j.id}><td className="xs t3">{j.date}</td><td className="mono ta xs ta">{j.id}</td><td className="xs">{j.desc}</td><td className="t2 xs">{j.dr}</td><td className="t2 xs">{j.cr}</td><td className="mono bold xs">{fmt(j.amt)}</td><td><Av name={poster?.name||"?"} size="sm"/></td></tr>;
              })}
            </tbody>
          </table>
        </div>
      )}

      {tab==="reports"&&(
        <div className="g g3 gap4">
          {[
            {title:"Income Statement",desc:"Revenue, expenses, and net profit",ico:"📊"},
            {title:"Balance Sheet",    desc:"Assets, liabilities, equity",     ico:"⚖️"},
            {title:"Cash Flow",       desc:"Operating, investing, financing",  ico:"💧"},
            {title:"Accounts Ageing", desc:"Overdue receivables by age",       ico:"📅"},
            {title:"VAT Return",      desc:"Tax payable to KRA",               ico:"🏛️"},
            {title:"Audit Trail",     desc:"All system transactions",          ico:"🔍"},
          ].map(r=>(
            <div key={r.title} className="card cp cur" onClick={()=>show(`Generating ${r.title}…`,"g")} style={{transition:"all .14s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="var(--sh)";}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
              <div style={{fontSize:28,marginBottom:10}}>{r.ico}</div>
              <div className="bold" style={{fontSize:13,marginBottom:3}}>{r.title}</div>
              <div className="xs t3">{r.desc}</div>
              <button className="btn btp bsm mt3" style={{justifyContent:"center"}}>Generate →</button>
            </div>
          ))}
        </div>
      )}

      {showM&&(
        <Modal title="New Journal Entry" onClose={()=>setShowM(false)}
          footer={<><button className="btn btg" onClick={()=>setShowM(false)}>Cancel</button><button className="btn btp" onClick={saveJE}>Post Entry</button></>}>
          <div className="g g2 gap3">
            <div className="field"><label className="flbl">Date</label><input className="inp" type="date" value={jeForm.date} onChange={e=>setJ("date",e.target.value)}/></div>
            <div className="field"><label className="flbl">Reference</label><input className="inp" value={jeForm.ref} onChange={e=>setJ("ref",e.target.value)} placeholder="e.g. INV-2401"/></div>
            <div className="field" style={{gridColumn:"span 2"}}><label className="flbl">Description *</label><input className="inp" value={jeForm.desc} onChange={e=>setJ("desc",e.target.value)} placeholder="Transaction description"/></div>
            <div className="field"><label className="flbl">Debit Account *</label>
              <select className="inp" value={jeForm.dr} onChange={e=>setJ("dr",e.target.value)}>
                <option value="">Select account…</option>
                {GL_ACCOUNTS.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Credit Account *</label>
              <select className="inp" value={jeForm.cr} onChange={e=>setJ("cr",e.target.value)}>
                <option value="">Select account…</option>
                {GL_ACCOUNTS.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            <div className="field"><label className="flbl">Amount (KES) *</label><input className="inp" type="number" value={jeForm.amt} onChange={e=>setJ("amt",e.target.value)} placeholder="0.00"/></div>
          </div>
          {jeForm.dr&&jeForm.cr&&parseFloat(jeForm.amt)>0&&(
            <div style={{marginTop:12,background:"rgba(108,108,255,.08)",border:"1px solid var(--bda)",borderRadius:8,padding:"10px 14px",fontSize:12}}>
              <span className="t2">DR </span><span className="bold">{jeForm.dr}</span><span className="t3"> · </span>
              <span className="t2">CR </span><span className="bold">{jeForm.cr}</span><span className="t3"> · </span>
              <span className="bold mono ta">{fmt(parseFloat(jeForm.amt)||0)}</span>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

// INVENTORY — full CRUD + stock movements
// ═══════════════════════════════════════════════════════════════════════════════
function Inventory() {
  const { state, actions } = useApp();
  const [showReceive, setShowReceive] = useState(false);
  const [showEdit, setShowEdit] = useState(null);
  const [show, toastEl] = useToast();
  const sel = useSelectors();

  const inventory = state.inventory || [];
  const products = state.products || [];

  const [rcvForm, setRcv] = useState({itemId:"",qty:1,ref:""});
  const setR=(k,v)=>setRcv(p=>({...p,[k]:v}));

  const receiveStock = () => {
    if(!rcvForm.itemId){show("Select a product","r");return;}
    if(!rcvForm.qty||rcvForm.qty<1){show("Quantity must be at least 1","r");return;}
    actions.receiveStock({itemId:rcvForm.itemId, qty:parseInt(rcvForm.qty), ref:rcvForm.ref||`PO-${uid()}`});
    actions.log({module:"Inventory",action:`Received ${rcvForm.qty} units`,user:state.currentUser?.name});
    show("Stock received","g");
    setShowReceive(false);
    setRcv({itemId:"",qty:1,ref:""});
  };

  const editForm = showEdit ? {...showEdit} : null;
  const [eForm, setEForm] = useState({});
  const openEdit = (item)=>{ setEForm({...item}); setShowEdit(item); };
  const setEF=(k,v)=>setEForm(p=>({...p,[k]:v}));
  const saveEdit = () => {
    actions.updateInventory({...eForm,qty:parseInt(eForm.qty),minStock:parseInt(eForm.minStock),cost:parseFloat(eForm.cost)});
    show("Item updated","g"); setShowEdit(null);
  };

  return (
    <div className="ci">
      {toastEl}
      <div className="ph">
        <div><h1 className="ptitle">Inventory</h1><p className="psub">Stock tracking · Warehouses · Transfers · Procurement</p></div>
        <div className="f fa gap2">
          <button className="btn btg bsm" onClick={()=>show("Transfer initiated","g")}>↔ Transfer</button>
          <button className="btn btp bsm" onClick={()=>setShowReceive(true)}>+ Receive Stock</button>
        </div>
      </div>
      <div className="g g4 gap4 mb5">
        {[
          {l:"Total SKUs",       v:fmtN(inventory.length),      ico:"🏷️",c:"#6c6cff",alert:false},
          {l:"Stock Value",      v:fmt(sel.stockValue),          ico:"💰",c:"#22c55e",alert:false},
          {l:"Low Stock Alerts", v:fmtN(sel.lowStockItems.length),ico:"⚠️",c:"#f59e0b",alert:sel.lowStockItems.length>0},
          {l:"Warehouses",       v:"3",                          ico:"🏭",c:"#06b6d4",alert:false},
        ].map(s=>(
          <div key={s.l} className="stat" style={{borderColor:s.alert?"rgba(245,158,11,.3)":undefined}}>
            <div className="sico" style={{background:`${s.c}18`}}>{s.ico}</div>
            <div className="slb">{s.l}</div>
            <div className="sv" style={{fontSize:22,color:s.alert?"var(--am)":undefined}}>{s.v}</div>
          </div>
        ))}
      </div>
      <div className="g gap4" style={{gridTemplateColumns:"1fr 240px"}}>
        <div className="tw bd">
          <table>
            <thead><tr><th>Product</th><th>SKU</th><th>On Hand</th><th>Min Stock</th><th>Warehouse</th><th>Unit Cost</th><th>Stock Value</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {inventory.map(item=>{
                const low=item.qty<=item.minStock;
                return (
                  <tr key={item.id}>

            <div className="field"><label className="flbl">Product Name</label><input className="inp" value={eForm.name||""} onChange={e=>setEF("name",e.target.value)}/></div>
            <div className="field"><label className="flbl">SKU</label><input className="inp" value={eForm.sku||""} onChange={e=>setEF("sku",e.target.value)}/></div>

// POS — orders saved to state, stock deducted, receipts
// ═══════════════════════════════════════════════════════════════════════════════
function POS() {
  const { state, actions } = useApp();
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState("");
  const [cat, setCat] = useState("All");
  const [payMethod, setPayMethod] = useState("Cash");
  const [payM, setPayM] = useState(false);
  const [lastOrder, setLastOrder] = useState(null);
  const [show, toastEl] = useToast();

  const products = state.products || [];
  const posOrders = state.posOrders || [];
  const cats = ["All",...Array.from(new Set(products.map(p=>p.cat)))];
  const filt = products.filter(p=>p.active&&(cat==="All"||p.cat===cat)&&p.name.toLowerCase().includes(search.toLowerCase()));

  const add = prod=>{
    const invItem = (state.inventory||[]).find(i=>i.prodId===prod.id);
    if(invItem&&invItem.qty<=0){show("Out of stock","r");return;}
    setCart(prev=>{const ex=prev.find(i=>i.id===prod.id);return ex?prev.map(i=>i.id===prod.id?{...i,qty:i.qty+1}:i):[...prev,{...prod,qty:1}];});
  };
  const setQ=(id,d)=>setCart(prev=>prev.map(i=>i.id===id?{...i,qty:Math.max(1,i.qty+d)}:i).filter(i=>i.qty>0));
  const removeItem=(id)=>setCart(prev=>prev.filter(i=>i.id!==id));

  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const vat=sub*0.16;
  const tot=sub+vat;
  const fmtP=v=>`KES ${Math.round(v).toLocaleString()}`;

  const processPayment = ()=>{
    const orderId=`POS-${String(posOrders.length+1).padStart(4,"0")}`;
    const order={
      id:orderId, items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),
      subtotal:sub, tax:vat, total:tot, payMethod,
      cashier:state.currentUser?.name||"Cashier",
      createdAt:now(),
    };
    actions.addPosOrder(order);
    actions.log({module:"POS",action:`Sale ${orderId} — ${fmtP(tot)}`,user:state.currentUser?.name});
    setLastOrder(order);
    setCart([]);
    setPayM(false);
    show(`Payment received — ${fmtP(tot)} ✓`,"g");
  };

  return (
    <div className="poswrap">
      {toastEl}
      <div className="posl">
        <div className="f fj fa mb3">
          <div><div className="bold lg">Point of Sale</div><div className="xs t3">Cashier: {state.currentUser?.name} · {posOrders.length} orders today</div></div>
          <div className="f fa gap2"><span className="badge bg">● Open</span><button className="btn btg bsm" onClick={()=>show("Session ended","g")}>End Session</button></div>
        </div>
        <input className="inp mb3" placeholder="🔍  Search products or scan barcode…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="f fa gap2 mb3 fw">{cats.map(c=><button key={c} className={`btn bsm ${cat===c?"btp":"btg"}`} onClick={()=>setCat(c)}>{c}</button>)}</div>
        <div className="ppg">
          {filt.map(p=>{
            const invItem=(state.inventory||[]).find(i=>i.prodId===p.id);
            const outOfStock=invItem&&invItem.qty<=0;
            return (
              <div key={p.id} className="pp" onClick={()=>!outOfStock&&add(p)} style={{opacity:outOfStock?.5:1}}>
                <div className="ppico">{p.ico}</div>
                <div className="ppname">{p.name}</div>
                <div className="ppprice">{fmtP(p.price)}</div>
                {invItem&&invItem.qty<30&&invItem.qty>0&&<div className="xs t3 mt1">Stock: {invItem.qty}</div>}
                {outOfStock&&<div className="xs tr mt1">Out of stock</div>}
              </div>
            );
          })}
        </div>
      </div>
      <div className="posr">
        <div className="pch f fj fa"><span>Current Order</span>{cart.length>0&&<button className="btn btd bxs" onClick={()=>setCart([])}>Clear</button>}</div>
        <div className="pcb">
          {cart.length===0&&(
            <div>
              <div className="empty"><div className="eico">🛒</div><div className="etitle">Cart is empty</div><div className="esub">Tap products to add them</div></div>
              {lastOrder&&(
                <div style={{margin:"0 8px",background:"rgba(34,197,94,.08)",border:"1px solid rgba(34,197,94,.2)",borderRadius:8,padding:"10px 12px"}}>
                  <div className="xs bold tg mb1">Last Order: {lastOrder.id}</div>
                  <div className="xs t3">Total: {fmtP(lastOrder.total)} · {lastOrder.payMethod}</div>
                  <div className="xs t3">{lastOrder.items.length} items</div>
                </div>
              )}
            </div>
          )}
          {cart.map(item=>(
            <div key={item.id} className="pci">
              <span style={{fontSize:18}}>{item.ico}</span>
              <div className="pcin trunc">{item.name}</div>
              <div className="qw">
                <div className="qbtn" onClick={()=>setQ(item.id,-1)}>−</div>
                <span className="bold" style={{minWidth:20,textAlign:"center"}}>{item.qty}</span>
                <div className="qbtn" onClick={()=>setQ(item.id,+1)}>+</div>
              </div>
              <div className="mono xs bold t2" style={{minWidth:72,textAlign:"right"}}>{fmtP(item.price*item.qty)}</div>
              <div className="qbtn" onClick={()=>removeItem(item.id)} style={{fontSize:11,width:18,height:18}}>✕</div>
            </div>
          ))}
        </div>
        <div className="pcf">
          <div className="f fj" style={{fontSize:12,color:"var(--t2)",marginBottom:5}}><span>Subtotal</span><span className="mono">{fmtP(sub)}</span></div>
          <div className="f fj" style={{fontSize:12,color:"var(--t2)",marginBottom:5}}><span>VAT (16%)</span><span className="mono">{fmtP(vat)}</span></div>
          <div className="div" style={{margin:"8px 0"}}/>
          <div className="ptot"><span>Total</span><span className="mono">{fmtP(tot)}</span></div>
          <div className="fc gap2">
            <button className="btn btp w100" style={{justifyContent:"center",padding:"11px"}} disabled={cart.length===0} onClick={()=>setPayM(true)}>💳  Charge {fmtP(tot)}</button>
            <div className="f gap2">
              {["M-Pesa","Cash","Card"].map(m=><button key={m} className={`btn f1 ${payMethod===m?"btp":"btg"}`} style={{justifyContent:"center",fontSize:11}} onClick={()=>setPayMethod(m)}>{m==="M-Pesa"?"📱 M-Pesa":m==="Cash"?"💵 Cash":"💳 Card"}</button>)}
            </div>
          </div>
        </div>
      </div>

      {payM&&(
        <Modal title={`Payment — ${fmtP(tot)}`} onClose={()=>setPayM(false)}
          footer={<><button className="btn btg" onClick={()=>setPayM(false)}>Cancel</button><button className="btn btp" onClick={processPayment}>Confirm {payMethod} Payment</button></>}>
          <div className="f fj fa mb4">
            <div><div className="xs t3 upper mb1">Payment Method</div><div className="bold">{payMethod}</div></div>
            <div><div className="xs t3 upper mb1">Amount Due</div><div className="bold mono ta" style={{fontSize:20}}>{fmtP(tot)}</div></div>
          </div>
          <div className="g g2 gap3">
            {[{ico:"📱",l:"M-Pesa",sub:"Paybill 400200"},{ico:"💳",l:"Card",sub:"Visa/Mastercard"},{ico:"💵",l:"Cash",sub:"Count & confirm"},{ico:"🏦",l:"Bank",sub:"RTGS / EFT"}].map(m=>(
              <div key={m.l} className="cur" onClick={()=>setPayMethod(m.l)} style={{background:payMethod===m.l?"rgba(108,108,255,.1)":"var(--bg3)",border:`1px solid ${payMethod===m.l?"var(--a)":"var(--bd)"}`,borderRadius:10,padding:"14px 12px",textAlign:"center",transition:"all .13s"}}>
                <div style={{fontSize:24,marginBottom:6}}>{m.ico}</div><div className="bold xs">{m.l}</div><div className="xs t3 mt1">{m.sub}</div>
              </div>
            ))}
          </div>
          <div className="f fj fa mt4" style={{padding:"10px 14px",background:"var(--bg3)",borderRadius:8}}>
            <span className="xs t2">{cart.length} items · {cart.reduce((s,i)=>s+i.qty,0)} units</span>
            <span className="bold mono ta">{fmtP(tot)}</span>
          </div>
        </Modal>
      )}
    </div>
  );
}
